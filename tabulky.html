<!doctype html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabulky AutoLAB</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
/* =========================================================
   PROHLÍŽEČ TABULEK AutoLAB (E1) – jen čtení ze stínu v SQL
   Paleta převzatá ze zakázkového listu 3.1 (tmavá / světlá).
   Grafika je pracovní, finální vzhled dodá uživatel.
   ========================================================= */
:root{
  --bg:#242528; --panel:#393B44; --head:#1A1A1A; --btn:#3D4451;
  --txt:#C8C9CC; --txt-dim:#939497; --txt-strong:#FFFFFF;
  --bd:#575E6E; --bd-soft:#3A3C42; --act:#CC9E13; --act-txt:#1A1A1A;
  --good:#3FA36B; --warn:#E0A526; --wait:#6E6F72; --bad:#E2686B;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#FFFFFF; --panel:#F0F1F3; --head:#DCDFE4; --btn:#DCDFE4;
  --txt:#172B4D; --txt-dim:#626F86; --txt-strong:#091E42;
  --bd:#C1C7D0; --bd-soft:#EBECF0; --act:#CC9E13; --act-txt:#1A1A1A;
  --good:#1F845A; --warn:#A54800; --wait:#626F86; --bad:#C9372C;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;border-radius:4px;padding:6px 10px;background:var(--btn);color:var(--txt);cursor:pointer;font:inherit}
.tab[aria-selected="true"]{background:var(--act);color:var(--act-txt);font-weight:600}
input[type=search],select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px}
input[type=search]{min-width:240px;flex:1 1 240px;max-width:420px}
.btn{border:1px solid var(--bd);border-radius:4px;padding:5px 10px;background:var(--btn);color:var(--txt);cursor:pointer;font:inherit}
.info{margin-left:auto;color:var(--txt-dim);font-size:12px;text-align:right}
.wrap{flex:1;overflow:auto}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--bd-soft);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
th{position:sticky;top:0;z-index:1;background:var(--head);color:var(--txt-strong);text-align:left;font-weight:600;cursor:pointer;user-select:none}
th .ar{color:var(--txt-dim);margin-left:4px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--panel)}
td.wrapcell{white-space:normal;min-width:220px}
.st{display:inline-block;padding:0 6px;border-radius:3px;font-size:12px;font-weight:600}
.st-ZALOŽENO{color:var(--wait);border:1px solid var(--wait)}
.st-NASAZENO{color:var(--good);border:1px solid var(--good)}
.st-SPOTŘEBOVANÉ{color:var(--txt-dim)}
.exp-bad{color:var(--bad);font-weight:600}
.exp-soon{color:var(--warn);font-weight:600}
.msg{padding:24px;color:var(--txt-dim)}
.msg.err{color:var(--bad)}
footer{padding:6px 12px;border-top:1px solid var(--bd);color:var(--txt-dim);font-size:12px;display:flex;gap:12px}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <input type="search" id="q" placeholder="Hledat (REF, DID, šarže, název…)" aria-label="Hledat">
  <select id="stav" aria-label="Stav balení" hidden>
    <option value="">všechny stavy</option>
    <option value="ZALOŽENO">ZALOŽENO (sklad)</option>
    <option value="NASAZENO">NASAZENO</option>
    <option value="SPOTŘEBOVANÉ">SPOTŘEBOVANÉ</option>
  </select>
  <button class="btn" id="csv" type="button">Export CSV</button>
  <div class="info" id="info"></div>
</header>
<div class="wrap" id="wrap"><div class="msg">Načítám…</div></div>
<footer><span id="count"></span><span>Jen ke čtení. Data jsou kopie sešitu EVIDENCE k uvedenému času, ne živý stav.</span></footer>
<script>
(function(){
  var t = window.TrelloPowerUp.iframe();
  try { var th = t.arg('theme') || (t.getContext() || {}).theme; if (th === 'light') document.documentElement.setAttribute('data-theme','light'); } catch(e){}

  var API = 'tabulky-api.php';
  var jwtTok = '', jwtExp = 0, cache = {}, cur = null, sortK = null, sortDir = 1;
  var $ = function(id){ return document.getElementById(id); };

  function token(){
    var now = Date.now()/1000;
    if (jwtTok && now < jwtExp - 60) return Promise.resolve(jwtTok);
    return t.jwt().then(function(j){
      jwtTok = j || '';
      try { jwtExp = JSON.parse(atob(jwtTok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp || 0; } catch(e){ jwtExp = now + 600; }
      return jwtTok;
    });
  }
  function get(q){
    return token().then(function(j){
      return fetch(API + (q ? '?' + q : ''), { headers: { 'X-Trello-JWT': j }, cache: 'no-store' });
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.ok) throw new Error((d && d.error) || 'chyba serveru');
      return d;
    });
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmtD(v){ if (!v) return ''; var p = String(v).split('-'); return p.length === 3 ? (+p[2]) + '. ' + (+p[1]) + '. ' + p[0] : v; }
  function parseCz(v){ var m = /^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/.exec(String(v || '')); return m ? new Date(+m[3], +m[2]-1, +m[1]) : null; }
  function fmtN(v){ if (v === null || v === '') return ''; var n = Number(v); return isNaN(n) ? v : String(+n.toFixed(3)).replace('.', ','); }

  function showMsg(txt, err){ $('wrap').innerHTML = '<div class="msg' + (err ? ' err' : '') + '">' + esc(txt) + '</div>'; }

  function load(id){
    cur = id; sortK = null; sortDir = 1;
    Array.prototype.forEach.call($('tabs').children, function(b){ b.setAttribute('aria-selected', b.dataset.id === id ? 'true' : 'false'); });
    $('stav').hidden = id !== 'baleni';
    if (cache[id]) return render();
    showMsg('Načítám…');
    get('t=' + encodeURIComponent(id)).then(function(d){ cache[id] = d; if (cur === id) render(); })
      .catch(function(e){ showMsg('Tabulku se nepodařilo načíst: ' + e.message, true); });
  }

  function rowsNow(){
    var d = cache[cur]; if (!d) return [];
    var q = $('q').value.trim().toLowerCase(), st = $('stav').value;
    var iSt = d.cols.findIndex(function(c){ return c.k === 'status'; });
    var rows = d.rows.filter(function(r){
      if (st && iSt >= 0 && r[iSt] !== st) return false;
      if (!q) return true;
      return r.some(function(v){ return v !== null && String(v).toLowerCase().indexOf(q) >= 0; });
    });
    if (sortK !== null) {
      var typ = d.cols[sortK].type;
      rows = rows.slice().sort(function(a, b){
        var x = a[sortK], y = b[sortK];
        if (x === null || x === '') return 1; if (y === null || y === '') return -1;
        if (typ === 'n') return (Number(x) - Number(y)) * sortDir;
        return String(x).localeCompare(String(y), 'cs', { numeric: true }) * sortDir;
      });
    }
    return rows;
  }

  function cell(c, v){
    if (v === null || v === undefined) return '<td></td>';
    if (c.k === 'status') return '<td><span class="st st-' + esc(v) + '">' + esc(v) + '</span></td>';
    if (c.k === 'expirace') {
      var dt = parseCz(v), cls = '';
      if (dt) { var dd = (dt - new Date()) / 864e5; cls = dd < 0 ? 'exp-bad' : (dd < 60 ? 'exp-soon' : ''); }
      return '<td class="' + cls + '">' + esc(v) + '</td>';
    }
    if (c.type === 'n') return '<td class="n">' + esc(fmtN(v)) + '</td>';
    if (c.type === 'd') return '<td>' + esc(fmtD(v)) + '</td>';
    var long = /^(mat_hlavni|mat_pomoc|poznamka|nazev)$/.test(c.k) && String(v).length > 60;
    return '<td' + (long ? ' class="wrapcell"' : '') + ' title="' + esc(v) + '">' + esc(v) + '</td>';
  }

  function render(){
    var d = cache[cur]; if (!d) return;
    var rows = rowsNow(), max = 1500;
    var h = '<table><thead><tr>' + d.cols.map(function(c, i){
      return '<th data-i="' + i + '">' + esc(c.label) + (sortK === i ? '<span class="ar">' + (sortDir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>';
    }).join('') + '</tr></thead><tbody>';
    h += rows.slice(0, max).map(function(r){ return '<tr>' + d.cols.map(function(c, i){ return cell(c, r[i]); }).join('') + '</tr>'; }).join('');
    h += '</tbody></table>';
    $('wrap').innerHTML = h;
    $('count').textContent = rows.length + ' z ' + d.rows.length + ' řádků' + (rows.length > max ? ' (zobrazeno prvních ' + max + ', zpřesni hledání)' : '');
    $('info').textContent = d.stav ? 'Stav ke kopii: ' + d.stav.cas + ' · verze sešitu ' + d.stav.verze : '';
  }

  $('wrap').addEventListener('click', function(e){
    var th = e.target.closest('th'); if (!th) return;
    var i = +th.dataset.i; if (sortK === i) sortDir = -sortDir; else { sortK = i; sortDir = 1; }
    render();
  });
  var tmr; $('q').addEventListener('input', function(){ clearTimeout(tmr); tmr = setTimeout(render, 150); });
  $('stav').addEventListener('change', render);

  $('csv').addEventListener('click', function(){
    var d = cache[cur]; if (!d) return;
    var q = function(v){ v = v === null ? '' : String(v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [d.cols.map(function(c){ return q(c.label); }).join(';')]
      .concat(rowsNow().map(function(r){ return r.map(q).join(';'); }));
    var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'autolab-' + cur + '.csv'; document.body.appendChild(a); a.click(); a.remove();
  });

  get('').then(function(d){
    $('tabs').innerHTML = d.tables.map(function(x){
      return '<button class="tab" role="tab" type="button" data-id="' + esc(x.id) + '">' + esc(x.title) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('tabs').children, function(b){ b.addEventListener('click', function(){ load(b.dataset.id); }); });
    load(t.arg('tab') || 'baleni');
  }).catch(function(e){ showMsg('Prohlížeč se nepodařilo otevřít: ' + e.message, true); });
})();
</script>
</body>
</html>
