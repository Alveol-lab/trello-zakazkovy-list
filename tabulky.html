<!doctype html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog AutoLAB</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
/* =========================================================
   PROHLÍŽEČ TABULEK AutoLAB (E1) – jen čtení ze stínu v SQL
   Paleta převzatá ze zakázkového listu 3.1 (tmavá / světlá).
   Grafika je pracovní, finální vzhled dodá uživatel.
   ========================================================= */
:root{
  --bg:#242528; --panel:#393B44; --head:#1A1A1A; --btn:#3D4451;
  --txt:#C8C9CC; --txt-dim:#939497; --txt-strong:#FFFFFF;
  --bd:#575E6E; --bd-soft:#3A3C42; --act:#CC9E13; --act-txt:#1A1A1A;
  --good:#3FA36B; --warn:#E0A526; --wait:#6E6F72; --bad:#E2686B;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#FFFFFF; --panel:#F0F1F3; --head:#DCDFE4; --btn:#DCDFE4;
  --txt:#172B4D; --txt-dim:#626F86; --txt-strong:#091E42;
  --bd:#C1C7D0; --bd-soft:#EBECF0; --act:#CC9E13; --act-txt:#1A1A1A;
  --good:#1F845A; --warn:#A54800; --wait:#626F86; --bad:#C9372C;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--bd)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;border-radius:4px;padding:6px 10px;background:var(--btn);color:var(--txt);cursor:pointer;font:inherit}
.tab[aria-selected="true"]{background:var(--act);color:var(--act-txt);font-weight:600}
input[type=search],select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px}
input[type=search]{min-width:240px;flex:1 1 240px;max-width:420px}
.btn{border:1px solid var(--bd);border-radius:4px;padding:5px 10px;background:var(--btn);color:var(--txt);cursor:pointer;font:inherit}
.info{margin-left:auto;color:var(--txt-dim);font-size:12px;text-align:right}
.wrap{flex:1;overflow:auto}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--bd-soft);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
th{position:sticky;top:0;z-index:1;background:var(--head);color:var(--txt-strong);text-align:left;font-weight:600;cursor:pointer;user-select:none}
th .ar{color:var(--txt-dim);margin-left:4px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--panel)}
td.wrapcell{white-space:normal;min-width:220px}
.st{display:inline-block;padding:0 6px;border-radius:3px;font-size:12px;font-weight:600}
.st-ZALOŽENO{color:var(--wait);border:1px solid var(--wait)}
.st-NASAZENO{color:var(--good);border:1px solid var(--good)}
.st-SPOTŘEBOVANÉ{color:var(--txt-dim)}
.exp-bad{color:var(--bad);font-weight:600}
.exp-soon{color:var(--warn);font-weight:600}
.msg{padding:24px;color:var(--txt-dim)}
.msg.err{color:var(--bad)}
footer{padding:6px 12px;border-top:1px solid var(--bd);color:var(--txt-dim);font-size:12px;display:flex;gap:12px}

/* ---------- E2a: úpravy karet MAT (záložka Materiál) ---------- */
.matbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.matbar[hidden],.bulk[hidden]{display:none}
.matbar label{display:flex;gap:4px;align-items:center;color:var(--txt);cursor:pointer;white-space:nowrap}
.btn.prim{background:var(--act);color:var(--act-txt);border-color:var(--act);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bulk{display:flex;gap:8px;align-items:center;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--act)}
.bulk b{color:var(--txt-strong)}
.bulk select,.bulk input{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:4px 6px}
td.ed{cursor:text}
td.ed:hover{outline:1px solid var(--bd);outline-offset:-1px}
td.miss{color:var(--warn);font-style:normal;opacity:.85}
td.miss::before{content:"chybí";font-size:11px}
td.editing{padding:1px 2px;overflow:visible}
td.editing input,td.editing select{width:100%;min-width:90px;font:inherit;color:var(--txt-strong);background:var(--bg);border:1px solid var(--act);border-radius:3px;padding:2px 5px}
td.ro{color:var(--txt-dim)}
td.chk,th.chk{width:26px;text-align:center;cursor:default}
tr.sel td{background:color-mix(in srgb,var(--act) 14%,transparent)}
tr.off td{opacity:.5;text-decoration:line-through}
tr.off td.chk,tr.off td.rs,tr.off td.more{text-decoration:none}
td.rs{width:20px;padding-right:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)} .dot.bad{background:var(--bad)}
td.more{cursor:pointer;color:var(--txt-dim);text-align:center}
td.more:hover{color:var(--txt-strong)}
.zas{font-variant-numeric:tabular-nums}
.side{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:var(--panel);border-left:1px solid var(--bd);box-shadow:-6px 0 18px rgba(0,0,0,.35);display:flex;flex-direction:column;z-index:5}
.side h3{margin:0;padding:12px 14px 4px;color:var(--txt-strong);font-size:15px}
.side .sub{padding:0 14px 10px;color:var(--txt-dim);border-bottom:1px solid var(--bd)}
.side .body{flex:1;overflow:auto;padding:10px 14px}
.side dl{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;margin:0 0 14px}
.side dt{color:var(--txt-dim)} .side dd{margin:0;color:var(--txt)}
.side input.pin{width:110px;font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:3px 6px;text-align:right}
.side input.pin:focus{outline:2px solid var(--act);outline-offset:0}
.side h4{margin:10px 0 6px;font-size:12px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.04em}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:6px 0;border-bottom:1px solid var(--bd-soft)}
.hist .t{color:var(--txt-dim);font-size:12px}
.hist .v{color:var(--txt-strong)} .hist s{color:var(--txt-dim)}
.side .foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--bd);flex-wrap:wrap}
.side .why{flex-basis:100%;color:var(--txt-dim);font-size:12px}
.dlgbg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:6}
.dlg{background:var(--panel);border:1px solid var(--bd);border-radius:6px;width:440px;max-width:94vw;max-height:80vh;display:flex;flex-direction:column}
.dlg h3{margin:0;padding:12px 14px;color:var(--txt-strong);font-size:15px;border-bottom:1px solid var(--bd)}
.dlg .body{padding:10px 14px;overflow:auto}
.dlg ul{margin:6px 0 0;padding-left:18px;columns:2;color:var(--txt)}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--bd)}
.dlg.wide{width:780px}
.side.wide{width:560px} #wrap.sk-open{margin-right:560px}
table.skt tbody tr{cursor:pointer} table.skt tr.cur td{background:var(--sel,rgba(255,255,255,.06))} table.skt td.kod{font-weight:600;color:var(--txt-strong);white-space:nowrap}
.tag{display:inline-block;padding:0 6px;border:1px solid var(--bd);border-radius:3px;font-size:11px;color:var(--txt-dim);white-space:nowrap}
.tag.warn{color:var(--warn);border-color:var(--warn)} .tag.dim{opacity:.7} span.dim{color:var(--txt-dim)}
.side a.lnk{color:var(--act);cursor:pointer} .side .chips{display:flex;flex-wrap:wrap;gap:4px}
.bp{display:grid;grid-template-columns:130px 1fr 150px;gap:6px 10px;align-items:center}
.bp label{color:var(--txt-dim)} .bp .hint{grid-column:1/-1;color:var(--txt-dim);font-size:12px;margin-top:4px}
.bp input,.bp select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:4px 6px;width:100%;box-sizing:border-box}
table.pv{width:100%;border-collapse:collapse;font-size:12px} table.pv td,table.pv th{padding:3px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
table.pv tr.same td{color:var(--txt-dim)} table.pv tr.bad td{color:var(--bad)} table.pv s{color:var(--txt-dim)}
.sum{display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap} .sum b{color:var(--txt-strong)}
.bulk a{color:var(--act);cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);max-width:560px;background:var(--head);color:var(--txt-strong);border:1px solid var(--bad);border-left:4px solid var(--bad);border-radius:4px;padding:9px 12px;z-index:7;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.toast.ok{border-color:var(--good)}
/* ---------- E2b: výrobky (záložka Výrobky) ---------- */
.side.wide{width:560px}
.side input.pin.wide,.side textarea.pin.wide{width:100%;text-align:left;font:inherit}
.side textarea.pin.wide{color:var(--txt);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:3px 6px;resize:vertical}
.chip{display:inline-block;padding:0 5px;border-radius:3px;font-size:11px;font-weight:600;margin-left:4px}
.chip.navrh{color:var(--act);border:1px solid var(--act)}
tr.nav td{background:color-mix(in srgb,var(--act) 6%,transparent)}
td.sk{cursor:pointer} td.sk:hover{outline:1px solid var(--bd);outline-offset:-1px}
td.warn{color:var(--warn)}
.dim{color:var(--txt-dim)} .bez{color:var(--bad);font-weight:600}
.skg{margin-bottom:10px}
.skh{color:var(--txt-strong);font-weight:600;margin-bottom:4px}
ul.skl{list-style:none;margin:0;padding:0;border:1px solid var(--bd-soft);border-radius:4px}
ul.skl li{display:flex;gap:6px;align-items:center;padding:3px 6px;border-bottom:1px solid var(--bd-soft)}
ul.skl li:last-child{border-bottom:0}
ul.skl li.bad code,ul.skl li.bad .nm{color:var(--bad)}
ul.skl code{color:var(--txt-strong);min-width:120px}
ul.skl .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt-dim)}
.tag{font-size:11px;color:var(--txt-dim);border:1px solid var(--bd);border-radius:3px;padding:0 4px;white-space:nowrap}
.ord{display:flex;gap:1px}
.ord button,button.ic{border:1px solid var(--bd);background:var(--btn);color:var(--txt);border-radius:3px;padding:0 5px;font:inherit;line-height:18px;cursor:pointer}
.ord button:disabled{opacity:.3;cursor:default}
.sk-add{position:relative;margin-top:4px}
.sk-in{width:100%;font:inherit;color:var(--txt);background:var(--bg);border:1px dashed var(--bd);border-radius:4px;padding:4px 6px}
.sk-in:focus{outline:2px solid var(--act);border-style:solid}
.sk-sug{position:absolute;left:0;right:0;top:100%;z-index:3;background:var(--head);border:1px solid var(--bd);border-radius:4px;max-height:240px;overflow:auto}
.sk-sug button{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--txt);font:inherit;padding:4px 8px;cursor:pointer}
.sk-sug button:hover,.sk-sug button:first-child{background:var(--panel)}
.sk-sug .dim{padding:6px 8px}
/* P6: pravidla sledovatelnosti u položky skladby */
ul.skl li{flex-wrap:wrap}
ul.skl .pr{flex-basis:100%;display:flex;gap:6px;align-items:center;padding:1px 0 2px 0;font-size:12px;color:var(--txt-dim)}
ul.skl .pr select,ul.skl .pr input{font:inherit;font-size:12px;color:var(--txt);background:var(--bg);border:1px solid var(--bd);border-radius:3px;padding:0 3px;height:20px}
ul.skl .pr input{width:80px}
ul.skl .pr select:disabled,ul.skl .pr input:disabled{opacity:.45}
ul.skl .pr .nast{color:var(--txt-strong)}
.tag.pov{color:var(--txt-strong);border-color:var(--act)}
.tag.grp{color:var(--act);border-color:var(--act)}
.sk-j{padding:6px 8px;background:var(--bg);border:1px solid var(--bd-soft);border-radius:4px;color:var(--txt);word-break:break-word;margin-bottom:8px}
.sk-j .t,.sk-act .t,.dlg .t{color:var(--txt-dim);font-size:12px}
.sk-act{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:10px}
.sk-act .t{margin-right:auto}
.dlg ul.one{columns:1}
.dlg .pozor{margin-top:10px;padding:8px 10px;border-left:4px solid var(--warn);background:var(--bg);color:var(--txt)}
.dlg .frm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg .frm label{display:flex;flex-direction:column;gap:3px;color:var(--txt-dim);font-size:12px}
.dlg .frm input,.dlg .frm select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:4px 6px}
/* ---------- trasování UID ↔ šarže (krok 29) ---------- */
.trbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--bd-soft)}
.trbar input{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:5px 8px;min-width:260px}
.trbar .hint{color:var(--txt-dim);font-size:12px}
.trhead{padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 16px}
.trhead div{color:var(--txt-dim)} .trhead b{color:var(--txt-strong);font-weight:600}
.trsec{padding:10px 12px 4px;color:var(--txt-dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.trc{color:var(--act);cursor:pointer;text-decoration:underline dotted}
.md{display:inline-block;padding:0 5px;border-radius:3px;font-size:11px;font-weight:700;background:var(--act);color:var(--act-txt)}
.lowc{color:var(--warn)}
td.vy{color:var(--txt-strong)}
.nahled{background:var(--act);color:var(--act-txt);font-weight:700;padding:2px 8px;border-radius:3px}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <input type="search" id="q" placeholder="Hledat (REF, DID, šarže, název…)" aria-label="Hledat">
  <select id="stav" aria-label="Stav balení" hidden>
    <option value="">všechny stavy</option>
    <option value="ZALOŽENO">ZALOŽENO (sklad)</option>
    <option value="NASAZENO">NASAZENO</option>
    <option value="SPOTŘEBOVANÉ">SPOTŘEBOVANÉ</option>
  </select>
  <div class="matbar" id="matbar" hidden>
    <label><input type="checkbox" id="fNeupl"> jen neúplné</label>
    <label><input type="checkbox" id="fZas"> jen se zásobou</label>
    <label><input type="checkbox" id="fOff"> i vyřazené</label>
    <button class="btn" id="mNew" type="button">+ karta</button>
    <button class="btn" id="mDavky" type="button" title="hromadné úpravy a jejich vrácení">Dávky</button>
  </div>
  <div class="matbar" id="vbar" hidden>
    <select id="vfS" aria-label="Skladba"><option value="">každá skladba</option><option value="se">se skladbou</option><option value="bez">bez skladby</option><option value="chyba">s chybou ve skladbě</option><option value="prav">s pravidly</option><option value="bezprav">bez pravidel</option></select>
    <label><input type="checkbox" id="vfNav"> jen návrhy</label>
    <label><input type="checkbox" id="vfOff"> i vyřazené</label>
    <button class="btn" id="vNew" type="button">+ výrobek</button>
  </div>
  <div class="matbar" id="sbar" hidden>
    <label><input type="checkbox" id="sfPraz"> jen prázdné</label>
    <label><input type="checkbox" id="sfSmis"> jen nesoulad odpisu</label>
    <button class="btn" id="sNew" type="button">+ skupina</button>
  </div>
  <button class="btn" id="csv" type="button">Export CSV</button>
  <div class="info" id="info"></div>
</header>
<div class="bulk" id="bulk" hidden></div>
<div class="wrap" id="wrap"><div class="msg">Načítám…</div></div>
<footer><span id="count"></span><span id="foottxt">Jen ke čtení. Data jsou kopie sešitu EVIDENCE k uvedenému času, ne živý stav.</span></footer>
<script>
(function(){
  /* z=prijem: otevřeno z formuláře příjmu materiálu, mimo Trello – ověřuje cookie přihlášení k příjmu */
  var P = new URLSearchParams(location.search), PRIJEM = P.get('z') === 'prijem';
  /* nahled=…json: náhled záložky Materiál bez serveru a bez zápisu, jen z disku / localhostu */
  var NAHLED = !!P.get('nahled') && (location.protocol === 'file:' || location.hostname === 'localhost');
  if (NAHLED) { PRIJEM = true; if (P.get('theme') === 'light') document.documentElement.setAttribute('data-theme','light'); }
  var t = PRIJEM ? null : window.TrelloPowerUp.iframe();
  if (PRIJEM) {
    var pth = null; try { pth = localStorage.getItem('prijemTheme'); } catch(e){}
    if ((P.get('theme') || pth) === 'light') document.documentElement.setAttribute('data-theme','light');
    document.title = 'Katalog AutoLAB – příjem';
  } else {
    try { var th = t.arg('theme') || (t.getContext() || {}).theme; if (th === 'light') document.documentElement.setAttribute('data-theme','light'); } catch(e){}
  }
  function arg(k){ return PRIJEM ? P.get(k) : t.arg(k); }

  var API = 'tabulky-api.php', MAT_API = 'mat-api.php', PROD_API = 'produkt-api.php';   /* krok 5: záložka Materiál živě ze SQL, jinak kopie */
  var jwtTok = '', jwtExp = 0, cache = {}, cur = null, sortK = null, sortDir = 1;
  var $ = function(id){ return document.getElementById(id); };

  function token(){
    var now = Date.now()/1000;
    if (jwtTok && now < jwtExp - 60) return Promise.resolve(jwtTok);
    return t.jwt().then(function(j){
      jwtTok = j || '';
      try { jwtExp = JSON.parse(atob(jwtTok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp || 0; } catch(e){ jwtExp = now + 600; }
      return jwtTok;
    });
  }
  function get(q){
    if (NAHLED) {
      if (!q) return Promise.resolve({ ok:true, stav:{ cas:'23. 11. 2026 16:32', verze:'176085' },
        tables:[{ id:'mat', title:'Materiál (MAT)' }, { id:'baleni', title:'Balení (LOT)' }, { id:'lotlog', title:'Deník odpisů (LOTLOG)' }, { id:'vyrobky', title:'Výrobky (PRODB)' }] });
      if (q === 't=mat') return fetch(P.get('nahled')).then(function(r){ return r.json(); });
      if (q === 't=skupiny') return fetch(P.get('nahled')).then(function(r){ return r.json(); }).then(function(d){
        if (!d.skup_info) d.skup_info = { skupiny:d.skupiny.map(function(k){ return { kod:k, popis:null, gas:/^SK-(MODEL-DIGITAL|IZOLACE|ORTO-AKRYLAT|LZICE|SILIKON-LAB)$/.test(k), vyrobky:[] }; }), historie:[] };
        d.smi_skupiny = true; return d; });
      if (q === 't=vyrobky' && P.get('nahledv')) return fetch(P.get('nahledv')).then(function(r){ return r.json(); }).then(nahledRole);
      return Promise.reject(new Error('v náhledu je jen záložka Materiál a Výrobky'));
    }
    if (q === 't=vyrobky') return req(PROD_API).catch(function(){ return req(API + '?' + q); });   /* P3: výrobky ze SQL, jinak kopie */
    if (q === 't=mat') return req(MAT_API).catch(function(){ return req(API + '?' + q); });   /* SQL vypnuté → kopie sešitu */
    if (q === 't=skupiny') return req(MAT_API + '?skupiny=1');                                 /* krok 36: číselník skupin */
    return req(API + (q ? '?' + q : ''));
  }
  function nahledRole(d){                       /* náhled: role=technik → pohled technika P; navrh=1 → ukázkový návrh */
    if (P.get('role') === 'technik') { d.kdo = 'P'; d.smi_upravovat = false; d.smi_navrhovat = true; }
    if (P.get('navrh')) {
      d.rows.push([9001, 'X121209', 'Ukázkový návrh – dlaha tištěná', 'OS', 'OR', 'ORR', 'D', null, null, null, null, null, null, 'ukázka do náhledu', 'návrh', 'P', '2026-11-23', 'P', '2026-11-23', 1, 0]);
      d.skladba['9001'] = [['hlavní', 'NDSGOR01000_01', 587], ['pomocný', 'PRR-MDL-SGY-0999', null]];
      d.zmeny.push([9001, '2026-11-23 20:14', 'P', 'prohlizec', 'vyrobek', null, 'návrh']);
    }
    return d;
  }
  function req(url, body){
    var o = { cache: 'no-store', headers: {} };
    if (body) { o.method = 'POST'; o.body = JSON.stringify(body); o.headers['Content-Type'] = 'application/json'; }
    return (PRIJEM
      ? (o.credentials = 'same-origin', fetch(url, o))
      : token().then(function(j){ o.headers['X-Trello-JWT'] = j; return fetch(url, o); })

        + (d.rezim === 'uid' ? ' · příloha k prohlášení výrobce (nenahrazuje ho)' : '') + '</div>'
        + html(d, true)
        + '<div class="foot">Způsob: AutoDID = balení vybrané automaticky podle výrobku; ruční = DID zapsané technikem; MD = materiál dodaný k zakázce; odpis LOTLOG = ruční odpis z deníku. Jistota „text“ = šarže zapsaná textem bez DID (výkony zhruba před červnem 2026).</div>'
        + '<scr' + 'ipt>window.onload=function(){if(!window.frameElement)setTimeout(function(){window.print();},300);};</scr' + 'ipt>'
        + '</body></html>';
      return { doc:doc, tit:tit };
    }
    function dl(doc, tit){                           /* tisk v rámečku Trella nejde → soubor ke stažení a tisku */
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([doc], { type:'text/html' }));
      a.download = tit.replace(/[^\w\u00C0-\u017F -]+/g, '').replace(/\s+/g, '_') + '.html'; document.body.appendChild(a); a.click(); a.remove();
    }
    return { show:show, open:open };
  })();

  get('').then(function(d){
    var iv = d.tables.findIndex(function(x){ return x.id === 'vyrobky'; });       /* krok 36: Skupiny za Výrobky */
    d.tables.splice(iv >= 0 ? iv + 1 : d.tables.length, 0, { id:'skupiny', title:'Skupiny' });
    d.tables = d.tables.concat([{ id:'trace', title:'Trasování' }]);
    $('tabs').innerHTML = d.tables.map(function(x){
      return '<button class="tab" role="tab" type="button" data-id="' + esc(x.id) + '">' + esc(x.title) + '</button>';
    }).join('');
    Array.prototype.forEach.call($('tabs').children, function(b){ b.addEventListener('click', function(){ load(b.dataset.id); }); });
    if (arg('trace')) TR.open(arg('trace')); else load(arg('tab') || 'baleni');
  }).catch(function(e){ showMsg('Prohlížeč se nepodařilo otevřít: ' + e.message, true); });
  window.__M = NAHLED ? M : null; window.__V = NAHLED ? V : null;
})();
</script>
