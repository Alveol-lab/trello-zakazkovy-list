<!doctype html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zakázkový list 3.1</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
/* =========================================================
   ZAKÁZKOVÝ LIST 3.1
   Mřížka 0–340 podle Formular_3-S1.svg: 1rem = šířka sekce / 340 (nastavuje JS).
   Okraj 5, mezera mezi poli 4, vnitřní odsazení textu 6.
   Pásy (materiál, seznam výkonů) jdou přes celou šířku.
   :root = tmavá paleta dle návrhu, html[data-theme="light"] = světlá
   (plochy podle světlého Trella, linky a tlumený text dle Atlassian DS).
   ========================================================= */
:root{
  --bg:#242528;          /* pozadí formuláře a polí                       */
  --panel:#393B44;       /* pás materiálu, tělo seznamu výkonů            */
  --head:#1A1A1A;        /* hlavička seznamu výkonů                       */
  --chip:#242528;        /* informační štítky v pásu materiálu            */
  --btn:#3D4451;
  --txt:#9E9FA2;
  --txt-hi:#C8C9CC;
  --txt-dim:#939497;
  --txt-head:#C8C9CC;
  --txt-strong:#FFFFFF;  /* nadpisy pásů                                  */
  --bd-hi:#9E9FA2;
  --bd:#939497;
  --bd-soft:#555555;
  --rule:#575E6E;
  --glyph:#9D9EA2;
  --blue:#2554AD;
  --ok:#3614C4;    --ok-txt:#E6E9FF;
  --doc:#3111BC;   --doc-txt:#D6EEF1;
  --inv:#CC9E13;   --inv-txt:#FFFAE6;
  --del:#6B2C31;   --del-txt:#F2D3D5;     /* zrušit                      */
  --edit:#6B4A1F;  --edit-txt:#F5E0C2;    /* editovat                    */
  --bad:#E2686B;
  --warn:#E0A526;        /* upozornění (spotřeba přes zbytek, rozhodnutí) */
  --good:#3FA36B;        /* nasazeno                                      */
  --wait:#6E6F72;
  --menu-shadow:rgba(0,0,0,.45);
  --lp-bg:#393B44;
  --lp-blk:#141821;
  --lp-txt:#C7C8CB;
  --lp-focus:#FFFFFF;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#FFFFFF;
  --panel:#F0F1F3;
  --head:#DCDFE4;
  --chip:#FFFFFF;
  --btn:#DCDFE4;
  --txt:#172B4D;
  --txt-hi:#091E42;
  --txt-dim:#626F86;
  --txt-head:#44546F;
  --txt-strong:#091E42;
  --bd-hi:#172B4D;
  --bd:#626F86;
  --bd-soft:#B3BAC5;
  --rule:#C1C7D0;
  --glyph:#626F86;
  --ok:#3614C4;    --ok-txt:#FFFFFF;
  --doc:#3111BC;   --doc-txt:#FFFFFF;
  --inv:#CC9E13;   --inv-txt:#FFFFFF;
  --del:#F4D6D8;   --del-txt:#AE2E24;
  --edit:#FBE3C7;  --edit-txt:#9A4A00;
  --warn:#B65C02;
  --good:#216E4E;
  --wait:#8993A4;
  --menu-shadow:rgba(9,30,66,.25);
  --lp-bg:#F0F1F3;
  --lp-blk:#FFFFFF;
  --lp-txt:#172B4D;
  --lp-focus:#0C66E4;
  color-scheme:light;
}

*{box-sizing:border-box}
html{font-size:1px}
html,body{margin:0!important;padding:0!important;overflow:hidden!important;background:var(--bg)!important}
body{font-family:Arial,"Helvetica Neue",-apple-system,"Segoe UI",Roboto,sans-serif;
     font-size:8.333rem;color:var(--txt);-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;background:var(--bg);padding:12rem 0 12rem}
[hidden]{display:none!important}

/* ---------- pole ---------- */
.row{display:flex;align-items:stretch;gap:4rem;padding:0 5rem}
.f{display:block;flex:none;min-width:0;height:20rem;margin:0;border:0;
   --c:var(--bd);box-shadow:inset 0 0 0 .6rem var(--c);border-radius:3.2rem;
   background:var(--bg);color:var(--txt-hi);font:inherit;font-size:8.333rem;
   line-height:20rem;padding:0 4rem 0 6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f::placeholder{color:var(--txt-dim);opacity:1}
.f:focus{outline:none;--c:var(--ok)}
html[data-theme="light"] .f:focus{--c:#0C66E4}
.f.hi{--c:var(--bd-hi)}
.f.soft{--c:var(--bd-soft);color:var(--txt-dim);font-size:7.083rem}
.f.ro{background:transparent;--c:var(--bd-soft);color:var(--txt-dim);font-size:7.083rem}
.f.ro.got{color:var(--txt-hi)}
.f.bare{background:transparent;--c:var(--bd-soft);color:var(--txt-dim);font-size:6.25rem;padding:0 2rem;text-align:center}
.f.ctr{text-align:center;padding:0 2rem}
.f.bad{--c:var(--bad)}
.f.warn{--c:var(--warn)}
.f.wait{color:var(--wait)}
.f[readonly]{cursor:default}
.f[disabled]{opacity:.55}
.grow{flex:1 1 auto!important}
input[type=date].f{padding-right:2rem;font-size:7.083rem}
input[type=date].f::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer;width:9rem;height:9rem;margin:0}

.r1 #anid{width:66rem}
.r1 #qa{width:30rem}
.r1 #lupa{width:21rem}
.lupa-ic{width:14rem;height:14rem;display:block}
.r2{margin-top:4rem}
.r2 .outwrap{width:66rem}
.r2 #ord{width:45rem}
.r2 #tid{width:26rem;margin-left:auto}
.r2 #ceny{width:30rem}
.r2 #cjed{width:56rem}
.r2 #ctot{width:68rem}

/* OUT – výběr jedné fáze (nebo žádné = výrobek) */
.outwrap{position:relative;flex:none;display:flex}
.outbtn{width:100%;text-align:left;cursor:pointer;background:var(--btn);color:var(--txt);
        --c:var(--bd-soft);padding-left:6rem;white-space:nowrap;overflow:hidden}
.outbtn .ar{display:inline-block;font-size:6rem;margin-right:2.6rem;vertical-align:.5rem;color:var(--txt-hi)}
.outmenu{position:absolute;z-index:5;top:calc(100% + 2rem);left:0;min-width:150rem;
         background:var(--btn);border-radius:3.2rem;padding:2.5rem 0;
         box-shadow:inset 0 0 0 .6rem var(--bd),0 3rem 10rem var(--menu-shadow)}
.outmenu button{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
                color:var(--txt);font:inherit;font-size:7.083rem;padding:3rem 7rem;white-space:nowrap}
.outmenu button:hover,.outmenu button.sel{background:rgba(127,127,127,.18)}

/* ---------- fulltext v popisu výrobku ---------- */
.ftwrap{position:relative}
.ftlist{position:absolute;z-index:6;top:2rem;left:109rem;width:226rem;max-height:150rem;overflow-y:auto;
        background:var(--lp-bg);border-radius:3.2rem;padding:3rem;box-shadow:0 3rem 10rem var(--menu-shadow)}
.ftlist button{display:flex;width:100%;border:0;background:none;cursor:pointer;text-align:left;
               color:var(--lp-txt);font:inherit;font-size:6.25rem;line-height:7.5rem;padding:2.5rem 3rem;border-radius:2rem}
.ftlist button:hover,.ftlist button.sel{background:var(--lp-blk)}
.ftlist .k{flex:none;width:42rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftlist .n{flex:1;min-width:0}
.ftmsg{font-size:6.25rem;color:var(--txt-dim);padding:2.5rem 3rem}

/* ---------- okno lupy výrobků (1. krok sady, 2. krok množství) ---------- */
.lp{position:absolute;z-index:8;top:8rem;left:5rem;width:330rem;background:var(--lp-bg);
    border-radius:6rem;padding:7rem 6rem;box-shadow:0 4rem 16rem var(--menu-shadow)}
.lp .lrow{display:flex;align-items:center;gap:4rem}
.lp #lpq{flex:1;width:auto;background:var(--lp-bg);--c:var(--lp-focus);color:var(--lp-txt);font-size:7.083rem}
.lp #lpx{width:20rem;font-size:10rem}
.lpres{margin-top:6rem;max-height:300rem;overflow-y:auto}
.lpblk{display:block;width:100%;border:0;cursor:pointer;text-align:left;background:var(--lp-blk);color:var(--lp-txt);
       font:inherit;font-size:6.25rem;line-height:7.6rem;padding:4rem 6rem;border-radius:4rem}
.lpblk+.lpblk{margin-top:4rem}
.lpblk:hover,.lpblk:focus{outline:none;box-shadow:inset 0 0 0 .6rem var(--lp-focus)}
.lpblk .it{display:flex}
.lpblk .k{flex:none;width:56rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpblk .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpmsg{font-size:6.25rem;color:var(--txt-dim);padding:3rem 2rem}
.lpq .qrow{display:flex;align-items:center;font-size:6.25rem;color:var(--lp-txt)}
.lpq .qrow+.qrow{margin-top:4.5rem}
.lpq .k{flex:none;width:52rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpq .f{width:24rem;height:18rem;line-height:18rem;background:var(--lp-blk);--c:var(--lp-blk);text-align:center;padding:0 2rem}
.lpq .f:focus{--c:var(--lp-focus)}
.lpq .f.bad{--c:var(--bad)}
.lpq .n{flex:1;min-width:0;margin-left:16rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpacts{display:flex;justify-content:flex-end;gap:4rem;margin-top:7rem}
.lpacts #lpback{width:21rem;font-size:10rem}
.lpacts #lpok{width:61rem;background:var(--ok);color:var(--ok-txt)}

/* ---------- tlačítka ---------- */
.btn{flex:none;min-width:0;height:20rem;border:0;border-radius:3.2rem;padding:0;cursor:pointer;
     background:var(--btn);color:var(--txt);font:inherit;font-size:8.333rem;line-height:1;
     display:flex;align-items:center;justify-content:center;gap:3rem}
.btn:hover{filter:brightness(1.18)}
.btn:focus-visible{outline:.8rem solid var(--lp-focus);outline-offset:1rem}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.glyph{font-size:15rem;font-weight:300}
.btn.pri{background:var(--ok);color:var(--ok-txt)}
#skipMat{flex:0 0 auto;padding:0 7rem;font-size:6.6rem;color:var(--txt-hi)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 .6rem var(--bd-soft)}
.ic12{width:11rem;height:11rem;display:block}

/* ---------- pás materiálu ---------- */
.band{margin-top:12rem;background:var(--panel);padding:6rem 0 7rem}
.bhead{display:flex;align-items:center;gap:4rem;padding:0 5rem;height:22rem}
.btitle{flex:1;min-width:0;display:flex;align-items:center;gap:4rem;color:var(--txt-strong);
        font-size:8.333rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btitle .ic12{flex:none}
.modes{display:flex;gap:3rem}
.modes .btn{width:22rem;height:22rem;background:var(--chip);color:var(--txt)}
.modes .btn[aria-pressed="true"]{background:var(--ok);color:var(--ok-txt)}
/* úkony panelu založení / nasazení (ikony z grafiky: krabice, kola, MD, END) */
.ops{display:flex;gap:3rem;margin-right:6rem}
.ops[hidden]{display:none}
.ops .btn{width:22rem;height:22rem;background:var(--chip);color:var(--txt-dim);font-size:6.6rem;font-weight:800;letter-spacing:-.1rem}
.ops .btn[aria-pressed="true"]{background:#C6C7CA;color:#242528}
html[data-theme="light"] .ops .btn[aria-pressed="true"]{background:#242528;color:#F1F2F4}
.btn.del{background:var(--del);color:var(--del-txt)}
.mbody{margin-top:6rem}
.mbody .row+.row{margin-top:4rem}
.c1{width:66rem} .c2{width:30rem} .c4{width:70rem}
/* pole s popiskem uvnitř (ks v 1 bal.) */
.fsx{position:relative;flex:none;display:block}
.fsx .f{width:100%;padding:0 34rem 0 4rem;text-align:left}
.fsx span{position:absolute;right:4rem;top:0;line-height:20rem;font-size:6.25rem;color:var(--txt-dim);pointer-events:none}
.fsx .f[disabled]+span{opacity:.55}

/* přepínač (osobní / společné, ks / bal) */
.seg{flex:none;display:flex;height:20rem;border-radius:3.2rem;background:var(--chip);
     box-shadow:inset 0 0 0 .6rem var(--bd-soft);padding:1.6rem;gap:1.6rem}
.seg button{flex:1;min-width:0;border:0;border-radius:2.2rem;background:none;cursor:pointer;
            color:var(--txt-dim);font:inherit;font-size:6.6rem;padding:0 2rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--txt-hi);font-weight:700}
html[data-theme="light"] .seg button[aria-pressed="true"]{background:#0C66E4;color:#fff}
.seg.off{opacity:.45;pointer-events:none}
.tgl{flex:none;height:20rem;border:0;border-radius:3.2rem;cursor:pointer;background:var(--chip);
     box-shadow:inset 0 0 0 .6rem var(--bd-soft);color:var(--txt-dim);font:inherit;font-size:7.083rem;
     display:flex;align-items:center;justify-content:center;gap:4rem;padding:0 5rem}
.tgl i{width:15rem;height:9rem;border-radius:5rem;background:var(--bd-soft);position:relative;flex:none}
.tgl i::after{content:"";position:absolute;top:1.3rem;left:1.3rem;width:6.4rem;height:6.4rem;border-radius:50%;background:var(--bg);transition:left .15s}
.tgl[aria-pressed="true"]{color:var(--txt-hi);box-shadow:inset 0 0 0 .6rem var(--warn)}
.tgl[aria-pressed="true"] i{background:var(--warn)}
.tgl[aria-pressed="true"] i::after{left:7.3rem}

/* informační štítky (zbytek, expirace, stav) */
.chips{flex:1;min-width:0;display:flex;gap:3rem;align-items:center}
.chip{flex:0 1 auto;min-width:0;height:20rem;line-height:20rem;border-radius:3.2rem;background:var(--chip);
      color:var(--txt-dim);font-size:6.6rem;padding:0 5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--txt-hi);font-weight:700}
.chip.good{color:var(--good);box-shadow:inset 0 0 0 .6rem var(--good)}
.chip.warn{color:var(--warn);box-shadow:inset 0 0 0 .6rem var(--warn)}
/* nová karta MAT (REF v číselníku chybí) */
#nMatRow .seg button{font-size:6.6rem}
#nMatRow .k1{width:66rem} #nMatRow .k2{width:30rem}
.f.newm{--c:var(--warn)}
.seg.bad{box-shadow:inset 0 0 0 .6rem var(--bad)}
.chip.newm{color:var(--warn);box-shadow:inset 0 0 0 .6rem var(--warn);background:transparent}
.sugg{position:absolute;z-index:41;min-width:60rem;max-height:122rem;overflow:auto;padding:2.5rem;border-radius:3.2rem;background:var(--panel);
       box-shadow:0 2rem 8rem var(--menu-shadow),inset 0 0 0 .5rem var(--rule)}
.sugg button{display:block;width:100%;height:14rem;padding:0 5rem;border:0;border-radius:2.5rem;background:transparent;
       color:var(--txt);font:inherit;font-size:6.6rem;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sugg button b{color:var(--txt-hi);font-weight:700}
.sugg button.on,.sugg button:hover{background:var(--chip);color:var(--txt-hi)}
.sugg .nw{padding:2rem 5rem 1rem;font-size:5.8rem;color:var(--warn)}
.hint{padding:3rem 5rem 0 75rem;font-size:6.25rem;line-height:8rem;color:var(--txt-dim);min-height:8rem}
.hint.warn{color:var(--warn)}
.hint.bad{color:var(--bad)}

/* našeptávač a výsledky hledání v LOT */
.lres{margin:5rem 5rem 0;max-height:150rem;overflow-y:auto;border-radius:3.2rem;background:var(--chip)}
.lres:empty{display:none}
.lres button{display:grid;grid-template-columns:34rem 1fr 46rem;gap:4rem;align-items:center;width:100%;
             border:0;background:none;cursor:pointer;text-align:left;color:var(--txt-hi);font:inherit;
             font-size:6.25rem;line-height:8rem;padding:3.5rem 6rem}
.lres button+button{box-shadow:inset 0 .6rem 0 var(--panel)}
.lres button:hover,.lres button.sel{background:rgba(127,127,127,.18)}
.lres .d{font-weight:700;white-space:nowrap}
.lres .p{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lres .p small{display:block;color:var(--txt-dim);font-size:5.4rem;line-height:6.6rem}
.lres .z{text-align:right;white-space:nowrap;font-size:5.8rem;color:var(--txt-dim)}
.lres .z.n{color:var(--good)}
.lmsg{font-size:6.25rem;color:var(--txt-dim);padding:4rem 6rem}

/* výsledek založení */
.created{margin:5rem 5rem 0;border-radius:3.2rem;background:var(--chip);padding:4rem 4rem 4rem 6rem;
         box-shadow:inset 0 0 0 .6rem var(--good)}
.created .t{font-size:6.6rem;color:var(--good);line-height:9rem}
.created .it{display:flex;align-items:center;gap:4rem;font-size:6.6rem;color:var(--txt-hi);margin-top:2rem}
.created .it span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.created .it b{flex:none;width:30rem}
.created .btn{height:15rem;font-size:6.25rem;padding:0 5rem}

/* rozhodnutí o materiálu (spotřebované balení, spotřeba ≥ zbytek …) */
.need{margin:6rem 5rem 0;border-radius:3.2rem;background:var(--bg);box-shadow:inset 0 0 0 .8rem var(--warn);padding:6rem 6rem 6rem}
.need h4{margin:0 0 4rem;font-size:7.5rem;font-weight:700;color:var(--warn)}
.ncard+.ncard{margin-top:6rem;padding-top:6rem;box-shadow:inset 0 .6rem 0 var(--bd-soft)}
.ncard .nt{font-size:7.083rem;line-height:9.5rem;color:var(--txt-hi)}
.ncard .nt b{font-weight:700}
.ncard .ns{font-size:6.25rem;line-height:8rem;color:var(--txt-dim)}
.ncard .ne{font-size:6.25rem;line-height:8rem;color:var(--bad)}
.nopt{display:flex;align-items:center;gap:4rem;margin-top:3rem;min-height:17rem;cursor:pointer;
      font-size:6.8rem;color:var(--txt);border-radius:2.5rem;padding:1rem 4rem}
.nopt:hover{background:rgba(127,127,127,.12)}
.nopt input[type=radio]{flex:none;width:9rem;height:9rem;margin:0;accent-color:var(--ok)}
.nopt span{flex:1;min-width:0;line-height:8.5rem}
.nopt .f{height:16rem;line-height:16rem;width:38rem;font-size:7.083rem;padding:0 3rem}
.nacts{display:flex;justify-content:flex-end;gap:4rem;margin-top:7rem}
.nacts .btn{padding:0 8rem}

/* seznam materiálu u rozpracovaného výkonu */
.mlist{margin:7rem 5rem 0}
.mrow{display:grid;grid-template-columns:34rem 26rem 1fr 18rem 20rem;gap:0;align-items:center;height:20rem;
      font-size:7.083rem;color:var(--txt-hi)}
.mrow+.mrow{margin-top:3rem}
.mrow>div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4rem;line-height:12rem}
.mrow .k1{padding-left:1rem;font-weight:700}
.mrow .k2,.mrow .k1{box-shadow:inset -.6rem 0 0 var(--rule)}
.mrow .k2{text-align:center}
.mrow .k3{font-size:6.6rem;color:var(--txt-dim)}
.mrow .k3 em{font-style:normal;color:var(--warn)}
.mrow .k4{font-size:5.8rem;color:var(--txt-dim);text-align:center;padding:0}
.mrow .btn{width:20rem;height:18rem;font-size:13rem;background:var(--bg)}
.mempty{font-size:6.6rem;color:var(--txt-dim);padding:2rem 1rem}

/* ---------- akce ---------- */
.acts{display:flex;justify-content:flex-end;gap:4rem;margin-top:8rem;padding:0 5rem}
.acts #clear{width:24rem;font-size:10rem;background:var(--del);color:var(--del-txt)}
.acts #insert{width:70rem;background:var(--ok);color:var(--ok-txt)}
.acts #insert:disabled{background:var(--btn);color:var(--txt-dim);opacity:.6}

/* ---------- seznam výkonů ---------- */
.caption{display:flex;align-items:center;gap:4rem;font-size:8.333rem;line-height:10rem;margin:6rem 0 0 5rem;color:var(--txt-strong)}
.tbl{margin-top:6rem;background:var(--panel)}
.tgrid{display:grid;grid-template-columns:5rem 50rem 16rem 1fr 15rem 50rem 28rem;align-items:center}
.thead{background:var(--head);color:var(--txt-head);height:16rem}
.thead span{font-size:6.25rem;letter-spacing:.3rem;white-space:nowrap}
.thead small{font-size:6rem}
.tbody{position:relative;min-height:40rem;padding:3rem 0 5rem}
/* skupina = výrobek + jeho fáze + materiál */
.grp{position:relative}
.grp+.grp{box-shadow:inset 0 .5rem 0 color-mix(in srgb,var(--rule) 55%,transparent)}
.tr{min-height:17rem}
.tr>div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:14rem;font-size:6.6rem}
.tr .anid{font-size:7.083rem;color:var(--txt-hi)}
.tr .qa{text-align:center;font-size:7.083rem;color:var(--txt-hi)}
.tr .nm{padding-left:6rem;color:var(--txt)}
.tr.pr .nm{color:var(--txt-hi)}
.tr.ph .nm{padding-left:15rem;position:relative}
.tr.ph .nm::before{content:"";position:absolute;left:7rem;top:2.6rem;width:4.4rem;height:4.6rem;
        border-left:.7rem solid var(--rule);border-bottom:.7rem solid var(--rule)}
.tr .tid{display:flex!important;justify-content:center;overflow:visible!important}
.tr .tid span{display:inline-block;min-width:10rem;height:10rem;line-height:10rem;padding:0 2rem;border-radius:5rem;text-align:center;
        font-size:5.8rem;font-weight:700;color:var(--txt-hi);box-shadow:inset 0 0 0 .6rem var(--rule)}
.tr.ph .tid span{font-weight:400;color:var(--txt-dim)}
.tr .lot{padding-left:4rem;display:flex!important;align-items:center}
.tr .ics{display:flex;justify-content:flex-end;align-items:center;gap:1.5rem;padding-right:4rem;overflow:visible!important}
.tr .ic{width:12rem;height:12rem;border:0;background:none;padding:0;cursor:pointer;color:var(--glyph);
        display:flex;align-items:center;justify-content:center;border-radius:3rem;transition:background .12s,color .12s}
.tr .ic:hover{background:var(--btn);color:var(--txt-hi)}
.tr .ic:focus-visible{outline:.6rem solid var(--ok);outline-offset:.4rem}
.tr .ic svg{width:8rem;height:8rem;display:block}
/* materiál výkonu – ikona s počtem DID */
.tr .lot .dc{display:inline-flex;align-items:center;gap:2rem;height:10rem;font:inherit;font-size:5.8rem;padding:0 3rem;border:0;border-radius:2.5rem;
        background:var(--bg);color:var(--txt-hi);white-space:nowrap;cursor:pointer}
.tr .lot button.dc:hover{filter:brightness(1.25)}
.tr .lot .dc svg{width:6.5rem;height:6.5rem;color:var(--glyph)}
.tr.hl{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.tr.hl .lot .dc{box-shadow:inset 0 0 0 .6rem var(--ok)}
.tr .lot .dc.err{background:var(--del);color:var(--del-txt)}
/* souhrn materiálu zakázky */
.msum{margin:6rem 0 0;background:var(--panel)}
.msum .mh{display:flex;align-items:center;gap:4rem;height:16rem;padding:0 5rem;cursor:pointer;font-size:7.083rem;color:var(--txt-strong);
        background:var(--head)}
.msum .mh .cnt{font-size:5.8rem;color:var(--txt-dim)}
.msum .mh .chev{margin-left:auto;width:12rem;height:12rem;display:flex;align-items:center;justify-content:center;color:var(--glyph);transition:transform .15s}
.msum .mh .chev svg{width:8rem;height:8rem}
.msum.open .mh .chev{transform:rotate(180deg)}
.msum .mb{display:none;padding:4rem 0 6rem}
.msum.open .mb{display:block}
.mgrid{display:grid;grid-template-columns:5rem 30rem 36rem 1fr 14rem 26rem 72rem;align-items:center;min-height:13rem;cursor:pointer}
.mgrid.hd{cursor:default}
.mgrid:not(.hd):hover{background:color-mix(in srgb,var(--txt-strong) 4%,transparent)}
.mgrid.hl,.mgrid.hl:hover{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.mgrid.hl>div:first-child{align-self:stretch;box-shadow:inset 1.3rem 0 0 var(--ok)}
.mgrid .n em{font-style:normal;color:var(--warn);margin-right:2rem}
.mgrid .t{text-align:center;font-size:5rem;letter-spacing:.3rem;color:var(--txt-dim)}
.mgrid .v b{font-weight:400;color:var(--txt-hi)}
.mgrid+.mgrid:not(.hd){box-shadow:inset 0 .4rem 0 color-mix(in srgb,var(--rule) 40%,transparent)}
.mgrid>div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:5.8rem;line-height:11rem;color:var(--txt)}
.mgrid .d{font-weight:700;color:var(--txt-hi)}
.mgrid .q{text-align:center;color:var(--txt-hi)}
.mgrid .v{font-size:5.4rem;color:var(--txt-dim);padding-left:4rem}
.mgrid.hd>div{font-size:5.8rem;color:var(--txt-dim)}
/* menu řádku výkonu (místo popupu Trella) */
.rmenu{position:absolute;z-index:40;display:flex;gap:2.5rem;padding:2.5rem;border-radius:3.2rem;background:var(--panel);
       box-shadow:0 2rem 8rem var(--menu-shadow),inset 0 0 0 .5rem var(--rule)}
.rmenu .btn{height:15rem;padding:0 6rem;font-size:6.6rem;border-radius:2.5rem}
.rmenu .ed{background:var(--edit);color:var(--edit-txt)}
.rmenu .dl{background:var(--del);color:var(--del-txt)}
.rmenu .btn:hover{filter:brightness(1.15)}
.tempty{font-size:7.083rem;color:var(--txt-dim);padding:4rem 10rem}

/* ---------- sumář ---------- */
.sum{display:flex;gap:4rem;margin-top:12rem;padding:0 5rem}
.scol{display:flex;flex-direction:column;flex:none}
.scol .box{height:20rem;border-radius:3.2rem;box-shadow:inset 0 0 0 .6rem var(--bd);
           color:var(--txt-hi);font-size:7.083rem;display:flex;align-items:center;justify-content:center;
           white-space:nowrap;overflow:hidden}
.scol .box.blue{box-shadow:inset 0 0 0 .6rem var(--blue)}
.scol .box.wait{color:var(--wait)}
.scol label{font-size:6.25rem;color:var(--txt-dim);margin-top:1.5rem;line-height:7rem;white-space:nowrap}
.s1{width:80rem} .s2{width:60rem} .s3{width:60rem;margin-left:auto} .s4{width:90rem}
.sbtn{display:flex;justify-content:flex-end;gap:4rem;margin-top:8rem;padding:0 5rem}
.sbtn #inv{width:66rem;background:var(--inv);color:var(--inv-txt)}
.sbtn #doc{width:66rem;background:var(--doc);color:var(--doc-txt)}
</style>
</head>

      <div class="row">

      </div>
      <div class="lres" id="lqList"></div>
    </div>

    <!-- založení / nasazení materiálu -->
    <div class="mbody" id="mNew" hidden>
      <div class="row">
        <input class="f hi c1" id="nref" placeholder="REF" autocomplete="off" title="REF z číselníku MAT">
        <input class="f hi ctr c2" id="nq" value="1" placeholder="Q" autocomplete="off" inputmode="numeric" title="počet balení – každé dostane vlastní DID">
        <input class="f ro grow" id="nnam" placeholder="název z číselníku MAT" readonly tabindex="-1">
        <input class="f hi c4" id="nlot" placeholder="LOT" autocomplete="off">
      </div>
      <div class="row" id="nMatRow" hidden>
        <div class="seg k1" id="nkat1" title="legislativní kategorie">
          <button type="button" data-v="F" aria-pressed="false" title="fixní protetika">F</button>
          <button type="button" data-v="R" aria-pressed="false" title="snímatelná protetika">R</button>
          <button type="button" data-v="O" aria-pressed="false" title="ortodoncie">O</button>
          <button type="button" data-v="U" aria-pressed="false" title="univerzální">U</button>
        </div>
        <div class="seg k2" id="nkat2" title="hlavní / pomocný materiál">
          <button type="button" data-v="M" aria-pressed="false" title="hlavní materiál">M</button>
          <button type="button" data-v="S" aria-pressed="false" title="pomocný materiál">S</button>
        </div>
        <input class="f hi grow" id="nvyr" placeholder="výrobce" autocomplete="off" title="výrobce – vyber z našeptávače, nový název jen pokud v seznamu není">
        <input class="f grow" id="ndod" placeholder="dodavatel" autocomplete="off" title="dodavatel – víc dodavatelů odděl čárkou">
      </div>
      <div class="row">
        <div class="seg c1" id="nforma" title="forma: kus nebo balení">
          <button type="button" data-v="ks" aria-pressed="true">kus</button>

<script>
(function () {
  var t = null;
  try { t = window.TrelloPowerUp && window.TrelloPowerUp.iframe(); } catch (e) { t = null; }
  var $ = function (id) { return document.getElementById(id); };
  var state = { mats: [], rows: [], editIndex: null, open: {} };

  /* pole formuláře, která se ukládají do řádku seznamu */
  var FIELDS = ['qa','anid','anam','ord','outs','tid','ceny','cjed','ctot','odmj','odmt'];

  /* ---- technici: písmeno = název listu v EVIDENCE = Trello účet ------ */
  var MEMBERS = {
    H: '588fa9e7e5db691bfe653bce',
    J: '611cc39d9beb8e6028ba3ae4',
    Z: '63cd0523a27f8901400a6dda',
    P: '63ea51fbb262b19c0189e9b8',
    U: '686d1aa4bc747a96bb0fd585',
    I: '63e911bcb90ab76e81ad4e6a'
  };
  /* formulář 3.1 se zatím testuje jen se zápisem do listu H;
     ostatní listy se zapnou doplněním písmene sem                      */
  var ACTIVE_SHEETS = ['H', 'J', 'Z', 'P', 'U', 'I'];
  function letterOf(memberId){
    for (var k in MEMBERS) if (MEMBERS[k] === memberId) return k;
    return '';
  }

  /* ---- fáze výroby (pole OUT) ---------------------------------------- */
  var PHASES = [
    ['DE','design / analýza projektu'],
    ['CN','CNC výrobní proces'],
    ['MB','model / pomocné práce'],
    ['FN','finalizace'],
    ['VB','inicializace podkladů / výběr barvy']
  ];
  function phaseName(c){
    for (var i = 0; i < PHASES.length; i++) if (PHASES[i][0] === c) return c + ' - ' + PHASES[i][1];
    return c;
  }
  function isPhase(r){ return !!(r && r.outs); }

  /* ---- Apps Script (EXPfce) ------------------------------------------ */
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyoF5oQtNIh8YktGX9lNcwj1OwSKbthQovlYIr-vbi2fJ6CN1heJYJxnB96zTVZDQpz/exec';

  var pbCache = {};
  function pricebookLookup(code, ver){
    var key = code + '|' + ver;
    if (Object.prototype.hasOwnProperty.call(pbCache, key)) return Promise.resolve(pbCache[key]);
    return fetch(SCRIPT_URL + '?code=' + encodeURIComponent(code) + '&ver=' + encodeURIComponent(ver), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        var hit = (d && d.anam != null) ? { anam:d.anam, cjedE:d.cjedE, cjedF:d.cjedF, odmI:d.odmI, odmJ:d.odmJ } : null;
        pbCache[key] = hit; return hit;
      }).catch(function(){ return undefined; });
  }
  var mtCache = {};
  function materialLookup(lot){
    if (Object.prototype.hasOwnProperty.call(mtCache, lot)) return Promise.resolve(mtCache[lot]);
    return fetch(SCRIPT_URL + '?lot=' + encodeURIComponent(lot), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ var hit = (d && d.mnam != null) ? { mnam:d.mnam } : null; mtCache[lot] = hit; return hit; })
      .catch(function(){ return undefined; });
  }

  function ctx(){ try { return t && t.getContext ? t.getContext() : null; } catch(e){ return null; } }
  function currentMemberId(){
    if (!t) return Promise.resolve(null);
    return Promise.resolve().then(function(){
      var c = ctx(); if (c && c.member) return c.member;
      return t.member('id').then(function(m){ return (m && m.id) || null; });
    }).catch(function(){ return null; });
  }
  function currentCardId(){
    if (!t) return Promise.resolve('');
    return Promise.resolve().then(function(){
      var c = ctx(); if (c && c.card) return c.card;
      return t.card('id').then(function(x){ return (x && x.id) || ''; });
    }).catch(function(){ return ''; });
  }
  function currentCardName(){
    if (!t) return Promise.resolve('');
    return t.card('name').then(function(c){ return (c && c.name) || ''; }).catch(function(){ return ''; });
  }

  /* hlášky: technik musí vždy vědět, jestli se zápis povedl */
  function wmsg(msg, sec){
    try { console.log('[ZL3] ' + msg); } catch (e) {}
    try { if (t && t.alert) t.alert({ message: String(msg).slice(0, 140), duration: sec || 5 }); } catch (e) {}
  }
  function werr(msg, op){ wmsg((op || 'Zápis') + ' do EVIDENCE se nepovedl – ' + msg, 15); }

  function postToScript(payload, okLabel, opLabel){
    return fetch(SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function(r){ if (!r.ok) { werr('server odmítl požadavek (HTTP ' + r.status + ').', opLabel); return null; } return r.json(); })
      .then(function(d){
        if (d && d.ok && d.lotError && d.needs && d.needs.length) wmsg(okLabel + d.ref + ' – materiál čeká na rozhodnutí.', 8);
        else if (d && d.ok && d.lotError) wmsg(okLabel + d.ref + ' – řádek zapsán, odpis materiálu selhal – edituj výkon a vlož znovu.' + (d.lotMsg ? ' (' + d.lotMsg + ')' : ''), 15);
        else if (d && d.ok) wmsg(okLabel + d.ref, 5);
        else if (d && d.needs) wmsg('Materiál potřebuje rozhodnutí – zápis zatím neproběhl.', 8);
        else if (d) werr(d.error || 'neznámá chyba serveru.', opLabel);
        return d;
      })
      .catch(function(err){ werr('nedostupné spojení (' + (err && err.message ? err.message : err) + ').', opLabel); return null; });
  }
  function postSilent(payload){
    return fetch(SCRIPT_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  }

  /* fronta zápisů z karty: zápis / výmaz se odešle až po dokončení
     předchozího, aby dva rychle vložené výkony nedostaly stejný řádek */
  var postQ = Promise.resolve(), postN = 0;
  function queued(job){
    if (postN > 0) wmsg('Zápis čeká ve frontě – předchozí se ještě ukládá…', 4);
    postN++;
    var p = postQ.then(job);
    postQ = p.then(function(){ postN--; }, function(){ postN--; });
    return p;
  }

  /* zápis jde do listu podle TID řádku (odešle se Trello účet technika,
     kterému list patří – Apps Script podle něj list vybírá)            */
  function sheetAllowed(letter, op){
    if (!MEMBERS[letter]) { wmsg((op || 'Zápis') + ' neproběhl – neznámý technik „' + letter + '“.', 12); return false; }
    if (ACTIVE_SHEETS.indexOf(letter) < 0) {
      wmsg((op || 'Zápis') + ' do listu ' + letter + ' zatím není aktivní – formulář 3.1 se testuje jen na listu H.'
         + (op === 'Zápis' ? ' Položka se nevložila.' : ''), 15);
      return false;
    }
    return true;
  }
  /* smazání = vyprázdnění datových sloupců řádku, řádek se nemaže */
  function clearInSheet(row){
    var ref = row && row._href, letter = (row && row.tid) || '';
    if (!ref) { wmsg('VÝMAZ NEPROBĚHL ! - nutno provést ručně v tabulce', 15); return Promise.resolve(null); }
    if (!letter) letter = String(ref).split('_')[0];
    if (!sheetAllowed(letter, 'Výmaz')) { wmsg('VÝMAZ NEPROBĚHL ! - nutno provést ručně v tabulce', 15); return Promise.resolve(null); }
    return queued(function(){ return postToScript({ action:'clearEvidence', memberId: MEMBERS[letter], ref: ref }, 'Vymazáno z ', 'Výmaz'); });
  }

  /* =================================================================
     POLE
     ================================================================= */
  function qaClean(v){
    v = String(v).replace(/,/g, '.').replace(/[^0-9.]/g, '');
    var i = v.indexOf('.');
    if (i >= 0) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, '').slice(0, 1);
    return v;
  }
  function qaNorm(v){
    v = qaClean(v); if (v === '' || v === '.') return '';
    var n = parseFloat(v); if (isNaN(n)) return '';
    return (n % 1 === 0) ? String(n) : n.toFixed(1);
  }
  function qaValid(v){ var n = parseFloat(v); return !isNaN(n) && n !== 0; }
  function anidClean(v){ return String(v).toUpperCase().replace(/[^0-9A-Z\-;|_\/]/g, ''); }
  function anidValid(v){ return anidClean(v).length > 0; }

  var ORD_FIELD_NAME = '\uD83D\uDC68\u200D\u2695\uFE0F', ORD_FIELD_ID = '67235a6d2934ab21b9be0d77';
  var TAG_FIELD_NAME = '\uD83C\uDFF7\uFE0F',             TAG_FIELD_ID = '677bedc70ea43cd1d7154d92';
  /* ORD: písmena i čísla (kliniky s více provozovnami, např. OP2), max. 3 znaky –
     tabulka podle délky 3 rozlišuje zadavatele od 2znakových outsource kódů.
     Na začátku musí být písmeno: čistě číselný kód by Sheets uložily jako číslo. */
  function ordClean(v){ return String(v).toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,3); }
  function ordValid(v){ return /^[A-Z][0-9A-Z]{0,2}$/.test(ordClean(v)); }
  function customFieldValue(name, id){
    if (!t) return Promise.resolve('');
    return Promise.all([ t.board('customFields'), t.card('customFieldItems') ]).then(function(r){
      var flds = (r[0] && r[0].customFields) || [], items = (r[1] && r[1].customFieldItems) || [], f = null, i;
      for (i = 0; i < flds.length; i++) if (flds[i].name === name) { f = flds[i]; break; }
      if (!f) for (i = 0; i < flds.length; i++) if (flds[i].id === id) { f = flds[i]; break; }
      if (!f) return '';
      for (i = 0; i < items.length; i++) {
        if (items[i].idCustomField !== f.id) continue;
        var v = items[i].value || {};
        return String(v.text != null ? v.text : (v.number != null ? v.number : ''));
      }
      return '';
    }).catch(function(){ return ''; });
  }
  /* Termín karty (Trello pole Termín) – termín splnění pro ordinaci; bez termínu prázdný řetězec */
  function cardDue(){
    if (!t) return Promise.resolve('');
    return t.card('due').then(function(c){ return (c && c.due) || ''; }).catch(function(){ return ''; });
  }
  function ordFromCustomField(){ return customFieldValue(ORD_FIELD_NAME, ORD_FIELD_ID); }
  function tagFromCustomField(){ return customFieldValue(TAG_FIELD_NAME, TAG_FIELD_ID); }

  /* TID: písmeno technika; výchozí = přihlášený technik, lze přepsat */
  function tidClean(v){ return String(v).toUpperCase().replace(/[^A-Z]/g,'').slice(0,1); }
  function tidValid(v){ return !!MEMBERS[v]; }
  var myLetter = '';
  /* CenT. = ročník ceníku: text max. 4 znaky, výchozí = dvojčíslí roku */
  function cenyClean(v){ return String(v).toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,4); }
  function cenyValid(v){ return String(v).length > 0; }
  function cenyDefault(){ return String(new Date().getFullYear()).slice(-2); }

  /* OUT: jedna fáze, nebo nic (= výrobek) */
  (function buildOutMenu(){
    var h = '<button type="button" data-v="">— výrobek (bez fáze)</button>';
    PHASES.forEach(function(p){ h += '<button type="button" data-v="' + p[0] + '">' + p[0] + ' - ' + p[1] + '</button>'; });
    $('outMenu').innerHTML = h;
  })();
  /* VB = výběr barvy: pevná odměna za zakázku, ne za kus – množství je
     vždy 1 a na jedné zakázce (kartě) smí být VB jen jednou            */
  var VB_CODE = 'VB';
  function vbLock(on){
    var q = $('qa');
    q.readOnly = !!on;
    if (on) { q.value = '1'; q.classList.remove('bad'); recalcTotal(); qnlSync(); }
  }
  function vbExists(skipIndex){
    for (var i = 0; i < state.rows.length; i++) {
      if (i !== skipIndex && state.rows[i].outs === VB_CODE) return true;
    }
    return false;
  }
  function outSet(v){
    vbLock(v === VB_CODE);
    $('outs').value = v || '';
    $('outTxt').textContent = v || 'OUT';
    Array.prototype.forEach.call($('outMenu').querySelectorAll('button'), function(b){
      b.classList.toggle('sel', b.getAttribute('data-v') === (v || ''));
    });
  }
  function outMenu(open){ $('outMenu').hidden = !open; resize(); }
  $('outBtn').addEventListener('click', function(e){ e.stopPropagation(); outMenu($('outMenu').hidden); });
  $('outMenu').addEventListener('click', function(e){
    e.stopPropagation();
    var b = e.target.closest('button'); if (!b) return;
    outSet(b.getAttribute('data-v')); outMenu(false);
  });
  document.addEventListener('click', function(){ outMenu(false); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') outMenu(false); });

  function mark(el, ok){ el.classList.toggle('bad', !ok); }
  function formValid(){
    var a = qaValid($('qa').value), b = anidValid($('anid').value), c = cenyValid($('ceny').value),
        d = ordValid($('ord').value), e = tidValid($('tid').value);
    mark($('qa'), a); mark($('anid'), b); mark($('ceny'), c); mark($('ord'), d); mark($('tid'), e);
    return a && b && c && d && e;
  }

  /* popis výrobku + ceny z ceníku (kód + ročník) */
  var pbSeq = 0, lastHit = null;
  function refreshAnam(){
    var code = anidClean($('anid').value), ver = $('ceny').value, el = $('anam');
    if (!code || !cenyValid(ver)) { el.classList.remove('wait'); el.value = ''; applyPrice(null); return; }
    var seq = ++pbSeq;
    el.classList.add('wait');
    pricebookLookup(code, ver).then(function(hit){
      if (seq !== pbSeq) return;
      el.classList.remove('wait');
      el.value = hit ? hit.anam : '';
      applyPrice(hit);
    });
  }
  function applyPrice(hit){
    lastHit = hit || null;
    var xkk = ordClean($('ord').value) === 'XKK';
    $('cjed').value = numFmt(lastHit ? (xkk ? lastHit.cjedF : lastHit.cjedE) : null);
    $('odmj').value = numFmt(lastHit ? (xkk ? lastHit.odmJ : lastHit.odmI) : null);
    recalcTotal();
  }
  function numParse(v){
    if (v == null) return NaN;
    v = String(v).replace(/\s|\u00a0/g, '').replace(/,/g, '.').replace(/[^0-9.\-]/g, '');
    var n = parseFloat(v); return isNaN(n) ? NaN : n;
  }
  function numFmt(v){
    var n = numParse(v); if (isNaN(n)) return '';
    return (n % 1 === 0 ? String(n) : n.toFixed(2).replace('.', ',')) + ' Kč';
  }
  function recalcTotal(){
    var q = numParse($('qa').value), c = numParse($('cjed').value), o = numParse($('odmj').value);
    $('ctot').value = (isNaN(q) || isNaN(c)) ? '' : numFmt(q * c);
    $('odmt').value = (isNaN(q) || isNaN(o)) ? '' : numFmt(q * o);
  }

  $('qa').addEventListener('input', function(){ var c = qaClean(this.value); if (c !== this.value) this.value = c; mark(this, qaValid(this.value)); recalcTotal(); qnlSync(); });
  $('qa').addEventListener('blur', function(){ this.value = qaNorm(this.value); mark(this, qaValid(this.value)); recalcTotal(); qnlSync(); });
  $('anid').addEventListener('input', function(){
    var p = this.selectionStart, c = anidClean(this.value);
    if (c !== this.value) { this.value = c; try { this.setSelectionRange(p, p); } catch(e){} }
    mark(this, anidValid(this.value));
  });
  $('anid').addEventListener('change', refreshAnam);
  $('ord').addEventListener('input', function(){ var c = ordClean(this.value); if (c !== this.value) this.value = c; mark(this, ordValid(this.value)); applyPrice(lastHit); });
  $('tid').addEventListener('input', function(){ var c = tidClean(this.value); if (c !== this.value) this.value = c; mark(this, tidValid(this.value)); });
  $('ceny').addEventListener('input', function(){ var c = cenyClean(this.value); if (c !== this.value) this.value = c; mark(this, cenyValid(this.value)); });
  $('ceny').addEventListener('change', refreshAnam);

  /* ---- motiv podle Trella (automatické přepínání) ---- */
  function applyTheme(mode){
    var m = (mode === 'light' || mode === 'dark') ? mode : null;
    if (!m) m = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', m);
  }
  (function initTheme(){
    var q = (location.search.match(/[?&]theme=(light|dark)/) || [])[1];
    if (q) { applyTheme(q); return; }
    var c = ctx(); applyTheme(c ? (c.initialTheme || c.theme) : null);
    try { if (t && t.subscribeToThemeChanges) t.subscribeToThemeChanges(applyTheme); } catch (e) {}
  })();

  /* ---- měřítko: 1rem = šířka / 340 ---- */
  var lastH = 0, pending = false;
  function scaleAndSize(){
    var w = $('app').clientWidth || document.documentElement.clientWidth || 340;
    document.documentElement.style.fontSize = (w / 340).toFixed(4) + 'px';
    if (!t) return;
    var menuExtra = $('outMenu').hidden ? 0 : 0;
    var h = Math.ceil($('app').getBoundingClientRect().height) + menuExtra;

  function addMaterial(){

  /* MD: expirace se předvyplní na dnešek + 24 měsíců (technik ji může přepsat);

  var mdExpAuto = '';
  function mdExpDefault(){
    var d = new Date(), t = new Date(d.getFullYear(), d.getMonth() + 24, d.getDate());
    if (t.getDate() !== d.getDate()) t = new Date(d.getFullYear(), d.getMonth() + 25, 0);   /* 29.–31. → konec měsíce */
    return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
  }

  /* našeptávač výrobce / dodavatele z hodnot v MAT

  function sgKey(v){ return String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

  function sgPart(inp){
    var v = inp.value;
    if (inp.id !== 'ndod') return { pre:'', q:v };
    var p = v.lastIndexOf(','); return p < 0 ? { pre:'', q:v } : { pre:v.slice(0, p + 1) + ' ', q:v.slice(p + 1) };

    var t = String(q).trim(); if (!t) return esc(name);
    var i = name.toLowerCase().indexOf(t.toLowerCase());
    return i < 0 ? esc(name) : esc(name.slice(0, i)) + '<b>' + esc(name.slice(i, i + t.length)) + '</b>' + esc(name.slice(i + t.length));
  }

    hit.sort(function(a, b){ return (sgKey(a).indexOf(k) === 0 ? 0 : 1) - (sgKey(b).indexOf(k) === 0 ? 0 : 1) || a.localeCompare(b, 'cs'); });
    SG.inp = inp; SG.list = hit.slice(0, 12); SG.idx = SG.list.length && k ? 0 : -1;

    el.innerHTML = SG.list.map(function(n, i){ return '<button type="button" data-i="' + i + '"' + (i === SG.idx ? ' class="on"' : '') + '>' + sgHi(n, part.q) + '</button>'; }).join('')
      + (k && !SG.list.length ? '<div class="nw">nový ' + (inp.id === 'nvyr' ? 'výrobce' : 'dodavatel') + ' – zkontroluj zápis</div>' : '');

      for (var i = 0; i < src.length; i++) if (sgKey(src[i]) === k) return src[i];

  function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* rodič fáze: rozbalený výrobek se stejným kódem, jinak poslední se stejným kódem */
  function parentFor(anid, skipId){

    state.rows.forEach(function(r, i){
      if (isPhase(r) || r.anid !== anid || r.id === skipId) return;

  function rowHl(r){ if (!hl.dids.length) return false; var d = rowDids(r); return d.some(function(x){ return hl.dids.indexOf(x) >= 0; }); }
  var MFLAG = { close:'spotřebováno', correct:'korekce', enough:'vystačilo', split:'+ bal.', reopen:'vráceno' };
  function vykonLab(r){
    if (!isPhase(r)) return r.anid;
    var par = r.pid ? state.rows[findIndexById(r.pid)] : null;
    return par ? (r.outs || '') : (r.anid + ' ' + (r.outs || ''));
  }
  /* souhrn: každý DID jednou, celková spotřeba a rozpad po výkonech */
  function renderMsum(){
    var map = {}, order = [];
    state.rows.forEach(function(r){
      (r.mats || []).forEach(function(m){
        [[matDid(m), m], [m.newDid, null], [m.newDid2, null]].forEach(function(pair){
          var d = pair[0]; if (!d) return; var mm = pair[1];
          if (!map[d]) { map[d] = { d:d, lot:'', nam:'', tuse:'', fl:[], q:0, v:[], vq:{} }; order.push(d); }
          var x = map[d];
          if (!mm) { if (x.fl.indexOf('nové bal.') < 0) x.fl.push('nové bal.'); return; }
          if (!x.lot && mm.lot) x.lot = mm.lot; if (!x.nam && mm.mnam) x.nam = mm.mnam; if (!x.tuse && mm.tuse) x.tuse = mm.tuse;
          if (mm.md && x.fl.indexOf('MD') < 0) x.fl.push('MD');
          if (mm.res && MFLAG[mm.res] && x.fl.indexOf(MFLAG[mm.res]) < 0) x.fl.push(MFLAG[mm.res]);
          var q = numParse(mm.q || mm.qnl); var lab = vykonLab(r);
          if (x.v.indexOf(lab) < 0) { x.v.push(lab); x.vq[lab] = 0; }
          if (!isNaN(q)) { x.q += q; x.vq[lab] += q; }
        });
      });
    });
    $('msumC').textContent = order.length ? '(' + order.length + ' DID)' : '';
    $('msum').style.display = order.length ? '' : 'none';
    $('msumB').innerHTML = '<div class="mgrid hd"><div></div><div>DID</div><div>LOT</div><div>název</div><div style="text-align:center">typ</div><div style="text-align:center">spotřeba</div><div style="padding-left:4rem">použito ve výkonech</div></div>'
      + order.map(function(d){ var x = map[d];
          var fl = x.fl.map(function(f){ return '<em>' + esc(f) + '</em>'; }).join('');
          var v = x.v.map(function(l){ return esc(l) + (x.v.length > 1 && x.vq[l] ? ' <b>' + numFmt0(x.vq[l]) + '</b>' : ''); }).join(' · ');
          return '<div class="mgrid' + (hl.dids.indexOf(d) >= 0 ? ' hl' : '') + '" data-hldid="' + esc(d) + '" title="ukázat výkony s tímto DID">'
               + '<div></div><div class="d">' + esc(d) + '</div><div>' + esc(x.lot) + '</div><div class="n">' + fl + esc(x.nam) + '</div>'
               + '<div class="t" title="' + esc(x.tuse) + '">' + (x.tuse === 'osobní' ? 'OS' : (x.tuse === 'společné' ? 'SP' : '')) + '</div>'
               + '<div class="q">' + (x.q ? numFmt0(x.q) : '') + '</div><div class="v">' + v + '</div></div>'; }).join('');
  }
  $('msumB').addEventListener('click', function(e){
    var el = e.target.closest('[data-hldid]'); if (!el) return;
    var d = el.getAttribute('data-hldid');
    hl = (hl.dids.length === 1 && hl.dids[0] === d && !hl.row) ? { dids: [], row: null } : { dids: [d], row: null };
    renderRows();
  });
  $('trows').addEventListener('click', function(e){
    var el = e.target.closest('[data-hlrow]'); if (!el) return;
    e.stopPropagation();
    var id = el.getAttribute('data-hlrow'), r = state.rows[findIndexById(id)]; if (!r) return;
    hl = (hl.row === id) ? { dids: [], row: null } : { dids: rowDids(r), row: id };
    $('msum').classList.add('open'); renderRows();
  });
  function numFmt0(n){ return String(Math.round(n * 1000) / 1000).replace('.', ','); }
  $('msumH').addEventListener('click', function(){ $('msum').classList.toggle('open'); resize(); });
  var IC_MENU = '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="8" cy="13" r="1.6"/></svg>';
  function rowHtml(r, kind){
    var i = state.rows.indexOf(r);
    var s = '<div class="tgrid tr ' + kind + (rowHl(r) ? ' hl' : '') + '"><div></div>';
    if (kind === 'pr') {
      s += '<div class="anid">' + esc(r.anid) + '</div><div class="qa">' + esc(r.qa) + '</div><div class="nm">' + esc(r.anam) + '</div>';
    } else {
      s += '<div class="anid"></div><div class="qa">' + esc(r.qa) + '</div>'
         + '<div class="nm">' + esc(phaseName(r.outs)) + (kind === 'orph' ? ' (' + esc(r.anid) + ')' : '') + '</div>';
    }
    var tl = r.tid || (r._href ? String(r._href).split('_')[0] : '');
    s += '<div class="tid">' + (tl ? '<span>' + esc(tl) + '</span>' : '') + '</div>'
       + '<div class="lot">' + lotsHtml(r) + '</div><div class="ics">';
    if (kind === 'pr') {
      s += '<button class="ic" data-menu="' + i + '" title="editovat / smazat">' + IC_MENU + '</button>';
    } else {
      s += '<button class="ic" data-menu="' + i + '" title="editovat / smazat">' + IC_MENU + '</button>';
    }
    return s + '</div></div>';
  }
  function renderRows(){
    ensureIds();
    var html = '', used = {};
    state.rows.forEach(function(r){
      if (isPhase(r)) return;
      html += '<div class="grp">' + rowHtml(r, 'pr');
      var ch = childrenOf(r);
      ch.forEach(function(c){ used[c.id] = 1; });
      ch.forEach(function(c){ html += rowHtml(c, 'ph'); });   /* fáze jsou vždy vidět */
      html += '</div>';
    });
    /* fáze, ke kterým na kartě není výrobek – zobrazí se samostatně */
    state.rows.forEach(function(r){ if (isPhase(r) && !used[r.id]) html += '<div class="grp">' + rowHtml(r, 'orph') + '</div>'; });
    $('trows').innerHTML = html || '<div class="tempty">zatím žádný výkon</div>';
    renderMsum(); sumRows(); resize();
  }
  $('trows').addEventListener('click', function(e){
    var tog = e.target.closest('[data-tog]');
    if (tog) { var id = tog.getAttribute('data-tog'); state.open[id] = !state.open[id]; renderRows(); return; }
    var m = e.target.closest('[data-menu]'); if (!m) return;
    e.stopPropagation();
    var i = parseInt(m.getAttribute('data-menu'), 10);
    if (rmIdx === i && !$('rmenu').hidden) { rmClose(); return; }
    rmOpen(i, m);
  });
  /* malé menu u tří teček: editovat (oranžová) / smazat (tlumená červená) */
  var rmIdx = null;
  function rmOpen(i, btn){
    var el = $('rmenu'), app = $('app');
    rmIdx = i; el.hidden = false;
    var a = app.getBoundingClientRect(), b = btn.getBoundingClientRect();
    var top = b.bottom - a.top + 2, left = b.right - a.left - el.offsetWidth;
    if (top + el.offsetHeight > app.offsetHeight - 4) top = b.top - a.top - el.offsetHeight - 2;
    el.style.top = Math.max(0, top) + 'px'; el.style.left = Math.max(4, left) + 'px';
  }
  function rmClose(){ $('rmenu').hidden = true; rmIdx = null; }
  $('rmEd').addEventListener('click', function(e){ e.stopPropagation(); var i = rmIdx; rmClose(); if (i != null) loadRow(i); });
  $('rmDl').addEventListener('click', function(e){ e.stopPropagation(); var i = rmIdx; rmClose(); if (i != null) deleteRow(i); });
  document.addEventListener('click', function(e){ if (!$('rmenu').hidden && !e.target.closest('#rmenu')) rmClose(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') rmClose(); });
  function deleteRow(i){
    var r = state.rows[i]; if (!r) return;
    if (!isPhase(r) && childrenOf(r).length) {
      wmsg('Výrobek má zapsané fáze – nejdřív smaž jeho fáze, potom výrobek.', 10);
      return;
    }
    state.rows.splice(i, 1);
    if (state.editIndex === i) clearForm(); else if (state.editIndex > i) state.editIndex--;
    renderRows(); save();
    clearInSheet(r).then(refreshOdmeny);
  }

  /* součty: cena celkem a zálohované komp. jen z výrobků (fáze nejsou
     prodávaná položka); odměny lab. počítá tabulka (rewardSum)        */
  function isZana(a){ return String(a || '').toUpperCase().indexOf('ZANA') === 0; }
  function sumRows(){
    var tot = 0, anyT = false, zal = 0, anyZ = false;
    state.rows.forEach(function(r){
      if (isPhase(r)) return;
      var n = numParse(r.ctot); if (isNaN(n)) return;
      if (isZana(r.anid)) { zal += n; anyZ = true; } else { tot += n; anyT = true; }
    });
    $('sumCena').textContent = anyT ? numFmt(tot) : '';
    $('sumZaloha').textContent = anyZ ? numFmt(zal) : '';
  }
  var odmSeq = 0, odmShown = 0;
  /* součet odměn přišel rovnou v odpovědi na zápis (jen když řádek patří
     přihlášenému technikovi – odměny v kartě jsou z jeho listu)        */
  function odmShow(d){
    ++odmSeq; ++odmShown;
    var el = $('sumOdmeny'); el.classList.remove('wait');
    el.textContent = (d && d.rows) ? numFmt(d.sum) : '';
  }
  /* zápis ve frontě; když odpověď součet nepřinesla, načte se zvlášť */
  function postJob(fn){
    return queued(function(){
      var n0 = odmShown;
      return Promise.resolve().then(fn).then(function(){ if (odmShown === n0) refreshOdmeny(); });
    });
  }
  function refreshOdmeny(){
    var el = $('sumOdmeny'), seq = ++odmSeq;
    el.classList.add('wait');
    Promise.all([ currentMemberId(), tagFromCustomField() ]).then(function(res){
      if (!res[0] || !res[1]) return null;
      return postSilent({ action:'rewardSum', memberId: res[0], tag: res[1] });
    }).then(function(d){
      if (seq !== odmSeq) return;
      el.classList.remove('wait');
      el.textContent = (d && d.ok && d.rows) ? numFmt(d.sum) : '';
    }).catch(function(){ if (seq === odmSeq) { el.classList.remove('wait'); el.textContent = ''; } });
  }

  /* fakturace – napojení na účetní program bude později */
  $('inv').addEventListener('click', function(){ wmsg('Fakturace zatím není napojená na účetní program.', 6); });

  /* dokumentace – zatím generuje prohlášení výrobce (list F-Stitek);
     rozšířené prohlášení + uživatelský manuál doplní Apps Script       */
  var docBusy = false;
  function derr(msg){ wmsg('Dokumentace se nepovedla – ' + msg, 15); }
  $('doc').addEventListener('click', function(){
    if (docBusy) return;
    var btn = this; docBusy = true; btn.disabled = true;
    wmsg('Dokumentace se připravuje…', 10);
    Promise.all([ currentMemberId(), tagFromCustomField(), currentCardId() ]).then(function(res){
      if (!res[0]) { derr('nepodařilo se zjistit přihlášený Trello účet.'); return null; }
      if (!res[1]) { derr('karta nemá vyplněný kód zakázky.'); return null; }
      if (!res[2]) { derr('nepodařilo se zjistit kartu.'); return null; }
      return postSilent({ action:'compliancePdf', memberId: res[0], tag: res[1], cardId: res[2] }).then(function(d){
        if (d && d.ok) wmsg('Prohlášení výrobce přiloženo: ' + d.name + (d.replaced ? ' (předchozí verze odebrána)' : ''), 8);
        else derr((d && d.error) ? d.error : 'server neodpověděl.');
      });
    }).catch(function(err){ derr('nedostupné spojení (' + (err && err.message ? err.message : err) + ').'); })
      .then(function(){ docBusy = false; btn.disabled = false; });
  });

  /* =================================================================
     FORMULÁŘ ↔ ŘÁDEK
     ================================================================= */
  function collect(){
    var o = { mats: state.mats.map(function(m){ return JSON.parse(JSON.stringify(m)); }) };
    FIELDS.forEach(function(f){ o[f] = $(f).value.trim(); });
    return o;
  }
  function fill(o){
    FIELDS.forEach(function(f){ $(f).value = (o && o[f]) || ''; });
    /* starší řádek mohl mít v OUT víc fází – do pole se vezme první */
    outSet(String($('outs').value).split(', ')[0] || '');
    lastHit = null;
    state.mats = (o && o.mats) ? o.mats.map(function(m){ return JSON.parse(JSON.stringify(m)); }) : [];
    renderMats();
  }
  function clearForm(){ fill({}); state.editIndex = null; clearMatRow(); updateInsertLabel(); resize(); }
  function updateInsertLabel(){ $('insert').textContent = (state.editIndex != null) ? 'přepsat' : 'vložit'; }
  function resetDefaults(){
    if (!$('ceny').value) $('ceny').value = cenyDefault();
    if (!$('tid').value && myLetter) $('tid').value = myLetter;
    ['qa','anid','ceny','ord','tid'].forEach(function(f){ $(f).classList.remove('bad'); });
    $('anam').classList.remove('wait');
    recalcTotal();
    if (!$('ord').value) ordFromCustomField().then(function(v){ if (!$('ord').value && v) { $('ord').value = ordClean(v); applyPrice(lastHit); } });
  }
  function loadRow(i){
    var r = state.rows[i]; if (!r) return;
    fill(r);
    if (!$('tid').value && r._href) $('tid').value = String(r._href).split('_')[0];
    state.editIndex = i; updateInsertLabel(); resetDefaults(); refreshAnam(); resize();
  }
  $('clear').addEventListener('click', function(){ clearForm(); resetDefaults(); });

  /* slučování výrobků: stejný kód + ORD + technik → jeden řádek,
     QA se sečte, šarže se sloučí (u stejné šarže se sečte QNL)        */
  function mergeMats(a, b){
    var cl = function(m){ return JSON.parse(JSON.stringify(m)); };
    var out = (a || []).map(cl);
    (b || []).forEach(function(m){
      var hit = null;
      for (var i = 0; i < out.length; i++) if (matDid(out[i]) === matDid(m) && !!out[i].md === !!m.md) { hit = out[i]; break; }
      if (hit) { if (hit.q != null) hit.q = qaNorm(String(numParse(hit.q) + numParse(m.q))); else hit.qnl = qaNorm(String(numParse(hit.qnl) + numParse(m.qnl))); }
      else out.push(cl(m));
    });
    return out;
  }
  function findMergeTarget(r, skip){
    if (isPhase(r)) return -1;                       /* fáze se nikdy neslučují */
    for (var i = 0; i < state.rows.length; i++) {
      var x = state.rows[i];
      if (i === skip || isPhase(x)) continue;
      if (x.anid === r.anid && (x.ord || '') === (r.ord || '') && (x.tid || '') === (r.tid || '')) return i;
    }
    return -1;
  }

  /* vložení jednoho řádku do seznamu (sloučení / přepis / nový);
     vrací podklad pro zápis do EVIDENCE nebo null, když vložit nelze   */
  function commitRow(r, edit){
    var old = (edit != null) ? state.rows[edit] : null;
    /* zapsaný řádek patří do listu svého technika – změna TID by přepsala
       řádek v cizím listu, proto se musí smazat a vložit znovu           */
    if (old && old._href && (old.tid || String(old._href).split('_')[0]) !== r.tid) {
      wmsg('U zapsané položky nelze změnit TID – smaž ji a vlož znovu pod správným technikem.', 12);
      mark($('tid'), false); return null;
    }
    if (r.outs === VB_CODE) {
      r.qa = '1';
      if (vbExists(edit == null ? -1 : edit)) {
        wmsg('Fáze VB už je na této zakázce zapsaná – na jednu zakázku smí být jen jednou.', 12);
        return null;
      }
    }
    var same = findMergeTarget(r, edit == null ? -1 : edit), target;
    if (same >= 0) {
      target = state.rows[same];
      target.qa   = qaNorm(String(numParse(target.qa) + numParse(r.qa)));
      target.mats = mergeMats(target.mats, r.mats);
      target.ctot = numFmt(numParse(target.qa) * numParse(target.cjed));
      target.odmt = numFmt(numParse(target.qa) * numParse(target.odmj));
      if (edit != null) state.rows.splice(edit, 1);
    } else if (old) {
      r.id = old.id; r._href = old._href; r.pid = isPhase(r) ? (old.pid || parentFor(r.anid, r.id)) : undefined;
      state.rows[edit] = r; target = r;
    } else {
      r.id = newId();
      if (isPhase(r)) { r.pid = parentFor(r.anid); if (r.pid) state.open[r.pid] = true; }
      state.rows.push(r); target = r;
    }
    return { r:r, same:same, old:old, target:target };
  }
  /* zápis do EVIDENCE – list podle TID; sloučení = nový řádek v listu */
  function postRow(c, card, refOver){
    var r = c.r;
    var ref = refOver || ((c.same >= 0) ? null : (c.old ? c.old._href : null));
    return postToScript({
      memberId: MEMBERS[r.tid], ref: ref,
      tag: card[1], patient: card[0], anid: r.anid, qa: r.qa,
      i: isPhase(r) ? r.outs : r.ord,
      ceny: r.ceny, lot: matLotText(r.mats), mat: matPayload(r.mats), due: card[2]
    }, 'Zapsáno do ', 'Zápis').then(function(resp){
      if (!resp) return;
      if (resp.ok && resp.odm && r.tid === myLetter) odmShow(resp.odm);
      if (resp.ok && resp.ref) {
        if (c.same >= 0) { if (!c.target._href) { c.target._href = resp.ref; save(); } }
        else { var idx = findIndexById(c.target.id); if (idx >= 0) { state.rows[idx]._href = resp.ref; save(); renderRows(); } }
      }
      /* stav odpisu u výkonu: řádek zapsán, ale odpis materiálu neproběhl */
      if (resp.ok && c.target) {
        var bad = !!resp.lotError;
        if (!!c.target.lotErr !== bad) { if (bad) c.target.lotErr = true; else delete c.target.lotErr; save(); renderRows(); }
      }
      /* materiál potřebuje rozhodnutí: bez zápisu (ok:false), nebo řádek
         zapsán a odpis neproběhl (lotError) → po rozhodnutí přepis řádku   */
      if (resp.needs && resp.needs.length && (!resp.ok || resp.lotError)) {
        return needsAsk(resp.needs, r.mats).then(function(go){
          if (c.target && c.target !== r) c.target.mats = mergeMats([], c.target.mats);
          renderRows(); save();
          if (!go) {
            if (resp.ok && c.target) { c.target.lotErr = true; save(); renderRows(); }
            wmsg('Materiál výkonu ' + r.anid + ' není odepsaný – uprav výkon a vlož znovu.', 15); return;
          }
          return postRow(c, card, resp.ok ? resp.ref : ref);
        });
      }
    });
  }
  function cardInfo(){ return Promise.all([ currentCardName(), tagFromCustomField(), cardDue() ]); }

  var insBusy = false;
  /* vložit je aktivní, jen když jsou vyplněná všechna pole potřebná pro zápis
     (Q, kód, ceník, ORD, technik) – kontrola bez červeného značení polí      */
  function insReady(){
    return qaValid($('qa').value) && anidValid($('anid').value) && cenyValid($('ceny').value)
        && ordValid($('ord').value) && tidValid($('tid').value);
  }
  function insSync(){
    var ok = !insBusy && insReady();
    if ($('insert').disabled === ok) $('insert').disabled = !ok;
    $('insert').title = ok ? '' : 'vyplň Q, kód produktu, ceník, ORD a technika';
  }
  document.addEventListener('input', insSync);
  document.addEventListener('change', insSync);
  setInterval(insSync, 400);                        /* hodnoty doplněné skriptem (ORD z karty, lupa, editace) */
  $('insert').addEventListener('click', function(){
    if (insBusy || !$('mNeed').hidden) return;
    $('qa').value = qaNorm($('qa').value);
    if (!formValid()) return;
    if (didOf($('did').value) && qaValid($('mq').value)) addMaterial();   /* rozepsaný materiál se nezahodí */
    var r = collect();
    if (lastHit && !isPhase(r)) r.anam = lastHit.anam;   /* popis vždy z ceníku, ne z fulltextu */
    if (!sheetAllowed(r.tid, 'Zápis')) return;
    var edit = state.editIndex, ref = (edit != null && state.rows[edit]) ? state.rows[edit]._href : null;
    insBusy = true; $('insert').disabled = true; $('insert').textContent = 'kontrola…';
    lotGate(r.mats, ref).then(function(go){
      insBusy = false; updateInsertLabel(); insSync();
      state.mats = r.mats.map(function(m){ return JSON.parse(JSON.stringify(m)); }); renderMats();
      if (!go) return;
      var c = commitRow(r, edit);
      if (!c) return;
      state.editIndex = null;
      clearForm(); resetDefaults(); renderRows(); save();
      return cardInfo().then(function(card){
        return postJob(function(){ return postRow(c, card); });
      });
    }).catch(function(err){
      insBusy = false; updateInsertLabel(); insSync();
      werr('chyba při přípravě dat (' + (err && err.message ? err.message : err) + ').');
    });
  });

  /* =================================================================
     PROSET – fulltext v popisu výrobku a okno lupy (sady / kódy)
     ================================================================= */
  function prosetQuery(params){
    var q = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(SCRIPT_URL + '?' + q, { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ return (d && d.ok !== false && Array.isArray(d.bloky)) ? d.bloky : (Array.isArray(d) ? d : null); })
      .catch(function(){ return null; });
  }

  /* -- fulltext: text v popisu + Enter → seznam shod → výběr vyplní kód -- */
  var ft = { items: [], sel: -1, seq: 0 };
  function ftClose(){ $('ftList').hidden = true; ft.items = []; ft.sel = -1; resize(); }
  function ftRender(msg){
    var el = $('ftList');
    if (msg) el.innerHTML = '<div class="ftmsg">' + esc(msg) + '</div>';
    else el.innerHTML = ft.items.map(function(it, i){
      return '<button type="button" data-i="' + i + '"' + (i === ft.sel ? ' class="sel"' : '') + '>'
           + '<span class="k">' + esc(it.kod) + '</span><span class="n">' + esc(it.nazev) + '</span></button>';
    }).join('');
    el.hidden = false; resize();
  }
  function ftPick(i){
    var it = ft.items[i]; if (!it) return;
    ftClose();
    $('anid').value = anidClean(it.kod); mark($('anid'), true);
    refreshAnam();
    $('qa').focus();
  }
  function ftSearch(){
    var text = $('anam').value.trim();
    if (text.length < 3) { ftRender('Napiš alespoň 3 znaky.'); return; }
    var seq = ++ft.seq;
    ftRender('Hledám…');
    prosetQuery({ search:text, typ:'kod' }).then(function(bloky){
      if (seq !== ft.seq) return;
      if (!bloky) { ftRender('Hledání se nepovedlo – zkus to znovu.'); return; }
      ft.items = [];
      bloky.forEach(function(b){ (b.polozky || []).forEach(function(p){ ft.items.push(p); }); });
      ft.sel = ft.items.length ? 0 : -1;
      if (!ft.items.length) ftRender('Žádná shoda.'); else ftRender();
    });
  }
  $('anam').addEventListener('keydown', function(e){
    var open = !$('ftList').hidden && ft.items.length;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (open && ft.sel >= 0) ftPick(ft.sel); else ftSearch();
    } else if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      ft.sel = (ft.sel + (e.key === 'ArrowDown' ? 1 : -1) + ft.items.length) % ft.items.length;
      ftRender();
    } else if (e.key === 'Escape') { ftClose(); }
  });
  $('anam').addEventListener('input', function(){ if (!$('ftList').hidden) ftClose(); });
  $('ftList').addEventListener('mousedown', function(e){ e.preventDefault(); });
  $('ftList').addEventListener('click', function(e){
    var b = e.target.closest('button[data-i]'); if (b) ftPick(+b.getAttribute('data-i'));
  });
  document.addEventListener('click', function(e){
    if (!$('ftList').hidden && !e.target.closest('#ftList') && e.target !== $('anam')) ftClose();
  });

  /* -- okno lupy: 1. krok výběr bloku, 2. krok kontrola množství -- */
  var lp = { bloky: [], blok: null, seq: 0 };
  function lpStep(n){ $('lpS1').hidden = n !== 1; $('lpS2').hidden = n !== 2; resize(); }
  function lpOpen(){
    ftClose();
    $('lp').hidden = false; lpStep(1);
    var text = $('anam').value.trim();
    $('lpq').value = text;
    $('lpRes').innerHTML = '';
    $('lpq').focus();
    if (text.length >= 3) lpSearch();
  }
  function lpClose(){ $('lp').hidden = true; lp.blok = null; resize(); }
  function lpMsg(m){ $('lpRes').innerHTML = '<div class="lpmsg">' + esc(m) + '</div>'; resize(); }
  function lpSearch(){
    var text = $('lpq').value.trim();
    if (text.length < 3) { lpMsg('Napiš alespoň 3 znaky a stiskni Enter.'); return; }
    var seq = ++lp.seq;
    lpMsg('Hledám…');
    prosetQuery({ search:text, ord: ordClean($('ord').value) }).then(function(bloky){
      if (seq !== lp.seq) return;
      if (!bloky) { lpMsg('Hledání se nepovedlo – zkus to znovu.'); return; }
      lp.bloky = bloky.filter(function(b){ return b.polozky && b.polozky.length; });
      if (!lp.bloky.length) { lpMsg('Žádná shoda.'); return; }
      $('lpRes').innerHTML = lp.bloky.map(function(b, i){
        return '<button type="button" class="lpblk" data-i="' + i + '">' + b.polozky.map(function(p){
          return '<span class="it"><span class="k">' + esc(p.kod) + '</span><span class="n">' + esc(p.nazev) + '</span></span>';
        }).join('') + '</button>';
      }).join('');
      resize();
    });
  }
  function lpPick(i){
    var b = lp.bloky[i]; if (!b) return;
    lp.blok = b;
    var def = qaNorm($('qa').value);           /* výchozí = Q z formuláře, jinak prázdné */
    $('lpQ').innerHTML = b.polozky.map(function(p, k){
      return '<div class="qrow"><span class="k">' + esc(p.kod) + '</span>'
           + '<input class="f" data-k="' + k + '" inputmode="decimal" autocomplete="off" value="' + esc(qaValid(def) ? def : '') + '">'
           + '<span class="n">' + esc(p.nazev) + '</span></div>';
    }).join('');
    lpStep(2);
    var first = $('lpQ').querySelector('input');
    if (first) { first.focus(); first.select(); }
  }
  function lpQInputs(){ return Array.prototype.slice.call($('lpQ').querySelectorAll('input')); }
  $('lpQ').addEventListener('input', function(e){
    var el = e.target; if (!el.matches('input')) return;
    var c = qaClean(el.value); if (c !== el.value) el.value = c;
    if (qaValid(el.value)) el.classList.remove('bad');
  });
  $('lpQ').addEventListener('focusout', function(e){
    var el = e.target; if (el.matches && el.matches('input') && el.value) el.value = qaNorm(el.value);
  });
  $('lpQ').addEventListener('keydown', function(e){
    if (e.key !== 'Enter' || !e.target.matches('input')) return;
    e.preventDefault();
    var all = lpQInputs(), k = all.indexOf(e.target);
    if (k < all.length - 1) { all[k + 1].focus(); all[k + 1].select(); } else lpConfirm();
  });
  function lpConfirm(){
    var b = lp.blok; if (!b) return;
    var inputs = lpQInputs(), ok = true;
    inputs.forEach(function(el){ el.value = qaNorm(el.value); var v = qaValid(el.value); el.classList.toggle('bad', !v); if (!v) ok = false; });
    if (!ok) { wmsg('Doplň množství u všech položek.', 6); var bad = $('lpQ').querySelector('.bad'); if (bad) bad.focus(); return; }
    if ($('outs').value) { wmsg('Sadu nelze vložit jako fázi – nejdřív zruš OUT.', 10); return; }
    var ord = ordClean($('ord').value), tid = $('tid').value, ceny = $('ceny').value;
    mark($('ord'), ordValid(ord)); mark($('tid'), tidValid(tid)); mark($('ceny'), cenyValid(ceny));
    if (!ordValid(ord) || !tidValid(tid) || !cenyValid(ceny)) { wmsg('Vyplň ve formuláři ORD, TID a ročník ceníku.', 10); return; }
    if (state.editIndex != null) { wmsg('Dokonči nebo zruš rozpracovanou úpravu řádku.', 10); return; }
    if (!sheetAllowed(tid, 'Zápis')) return;

    var xkk = ord === 'XKK';
    var items = b.polozky.map(function(p, k){ return { kod: anidClean(p.kod), nazev: p.nazev, qa: inputs[k].value }; });
    $('lpok').disabled = true;
    Promise.all(items.map(function(it){ return pricebookLookup(it.kod, ceny); })).then(function(hits){
      var commits = [];
      items.forEach(function(it, k){
        var h = hits[k] || null, cj = h ? (xkk ? h.cjedF : h.cjedE) : null, od = h ? (xkk ? h.odmJ : h.odmI) : null;
        var r = { qa: it.qa, anid: it.kod, anam: h ? h.anam : it.nazev, ord: ord, outs: '', tid: tid, ceny: ceny,
                  cjed: numFmt(cj), ctot: numFmt(numParse(it.qa) * numParse(cj)),
                  odmj: numFmt(od), odmt: numFmt(numParse(it.qa) * numParse(od)), mats: [] };
        var c = commitRow(r, null); if (c) commits.push(c);
      });
      $('lpok').disabled = false;
      lpClose();
      ['qa','anid','anam'].forEach(function(f){ $(f).value = ''; $(f).classList.remove('bad'); });
      applyPrice(null); qnlSync();
      renderRows(); save();
      /* zápisy do EVIDENCE postupně, aby se v listu nepřekrývaly řádky */
      return cardInfo().then(function(card){
        return postJob(function(){
          return commits.reduce(function(p, c){ return p.then(function(){ return postRow(c, card); }); }, Promise.resolve());
        });
      });
    }).catch(function(err){
      $('lpok').disabled = false;
      werr('chyba při přípravě dat (' + (err && err.message ? err.message : err) + ').');
    });
  }
  $('lupa').addEventListener('click', function(e){ e.stopPropagation(); if ($('lp').hidden) lpOpen(); else lpClose(); });
  $('lpx').addEventListener('click', lpClose);
  $('lpback').addEventListener('click', function(){ lp.blok = null; lpStep(1); $('lpq').focus(); });
  $('lpok').addEventListener('click', lpConfirm);
  $('lpq').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); lpSearch(); }
    else if (e.key === 'Escape') lpClose();
  });
  $('lpRes').addEventListener('click', function(e){
    var b = e.target.closest('.lpblk'); if (b) lpPick(+b.getAttribute('data-i'));
  });
  $('lp').addEventListener('click', function(e){ e.stopPropagation(); });

  /* ---- perzistence v kartě (sdílená data, stejný klíč jako verze 2) ---- */
  function save(){
    if (!t) return;
    t.set('card', 'shared', 'zakazkovyList', { rows: state.rows }).catch(function(err){
      wmsg('Seznam se do karty neuložil – ' + (err && err.message ? err.message : 'neznámá chyba')
         + '. Karta má limit dat cca 4 000 znaků.', 15);
    });
  }
  function load(){
    /* zjištění technika nesmí načtení seznamu zablokovat – nejvýš 2 s */
    var ready = t ? Promise.race([
      currentMemberId().then(function(mid){ myLetter = letterOf(mid); }),
      new Promise(function(res){ setTimeout(res, 2000); })
    ]) : Promise.resolve();
    ready.then(function(){
      resetDefaults();
      if (!t) {
        if (window.__ZL_DEMO__) { state.rows = window.__ZL_DEMO__.rows || []; state.mats = window.__ZL_DEMO__.mats || []; state.open = window.__ZL_DEMO__.open || {}; }
        renderMats(); renderRows(); return null;
      }
      return t.get('card', 'shared', 'zakazkovyList').then(function(d){
        state.rows = (d && d.rows) || [];
      }).catch(function(){}).then(function(){ renderMats(); renderRows(); refreshOdmeny(); });
    });
  }
  outSet('');
  setMode('use');
  renderMats();
  load();
  resize();
})();
</script>
</body>
</html>
