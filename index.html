<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zakázkový list — Trello Power-Up</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
window.TrelloPowerUp.initialize({
  'card-back-section': function (t) {
    var theme = 'dark';
    try {
      var ctx = t.getContext();
      if (ctx && ctx.theme) theme = ctx.theme;
    } catch (e) {}
    return {
      title: 'Zakázkový list',
      /* Adresa musí být absolutní – ikonu vykresluje Trello ve svém vlastním
         rozhraní na trello.com, relativní cesta by se hledala tam.        */
      icon: 'https://www.denteo.space/zakazkovy-list/logo-icon.jpg',
      content: {
        type: 'iframe',
        url: t.signUrl('./section.html', { theme: theme }),
        height: 300
      }
    };
  }
});
</script>
</body>
</html>
