<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zakázkový list — Trello Power-Up</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
window.TrelloPowerUp.initialize({
  'card-back-section': function (t) {
    var theme = 'dark', member = '';
    try {
      var ctx = t.getContext();
      if (ctx && ctx.theme) theme = ctx.theme;
      if (ctx && ctx.member) member = ctx.member;
    } catch (e) {}
    /* Formulář 3.1 používají všichni technici (H, J, Z, P, U, I).
       Starý formulář section.html zůstává v repozitáři jako záloha.    */
    var page = './section3.html';
    return {
      title: 'Zakázkový list',
      /* Šedá jednobarevná ikona – Trello u card-back-section barevné nepovoluje.
         Barevné logo (logo-icon.jpg) je ikonou celého power-upu a nastavuje se
         v administraci power-upu, ne tady.
         Adresa musí být absolutní – ikonu vykresluje Trello ve svém vlastním
         rozhraní na trello.com, relativní cesta by se hledala tam.        */
      icon: 'https://www.denteo.space/zakazkovy-list/logo-icon-gray.svg',
      content: {
        type: 'iframe',
        url: t.signUrl(page, { theme: theme }),
        height: 300
      }
    };
  }
});
</script>
</body>
</html>
