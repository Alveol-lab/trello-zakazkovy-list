<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zakázkový list — Trello Power-Up</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
window.TrelloPowerUp.initialize({
  /* Katalog AutoLAB (dříve „Tabulky“, soubor tabulky.html zůstává): jen čtení skladu a výrobků ze stínu v SQL.
     Tlačítko vidí všichni na nástěnce, data pustí server jen technikům,
     recepci a Brigit (ověřený Trello JWT v tabulky-api.php).            */
  'board-buttons': function (t) {
    return [{
      icon: {
        /* dark = tmavý režim Trella → světlá ikona; light = světlý režim → tmavá */
        dark:  'https://www.denteo.space/zakazkovy-list/ikona-katalog-kniha-svetla.svg',
        light: 'https://www.denteo.space/zakazkovy-list/ikona-katalog-kniha-tmava.svg'
      },
      /* Piktogram otevřené knihy a název velkými písmeny (25. 11. 2026).
         Tlačítko je schované v nabídce Vylepšení (zástrčka); jestli je vidět
         i v liště, řídí přepínač v té nabídce, ne kód.
         Prázdný text Trello nevykreslí, proto název zůstává.             */
      text: 'KATALOG',
      callback: function (t) {
        var theme = 'dark';
        try { var ctx = t.getContext(); if (ctx && ctx.theme) theme = ctx.theme; } catch (e) {}
        return t.modal({
          url: t.signUrl('./tabulky.html', { theme: theme }),
          fullscreen: true,
          title: 'Katalog AutoLAB – materiál, výrobky a sklad'
        });
      }
    }];
  },
  'card-back-section': function (t) {
    var theme = 'dark', member = '', board = '';
    try {
      var ctx = t.getContext();
      if (ctx && ctx.theme) theme = ctx.theme;
      if (ctx && ctx.member) member = ctx.member;
      if (ctx && ctx.board) board = ctx.board;
    } catch (e) {}
    /* Majda (recepce) na nástěnce DTO_Provoz Zakázkový list nepotřebuje,
       sekci jí tam neukazujeme (25. 11. 2026). Ostatním i jinde beze změny. */
    var SKRYT = { '6729d465d1b26f09436d5d8b': ['655329144f809c15a1896437'] };
    if (SKRYT[board] && SKRYT[board].indexOf(member) !== -1) return null;
    /* Formulář 3.1 používají všichni technici (H, J, Z, P, U, I).
       Starý formulář section.html zůstává v repozitáři jako záloha.    */
    var page = './section3.html';
    return {
      title: 'Zakázkový list',
      /* Šedá jednobarevná ikona – Trello u card-back-section barevné nepovoluje.
         Barevné logo (logo-icon.jpg) je ikonou celého power-upu a nastavuje se
         v administraci power-upu, ne tady.
         Adresa musí být absolutní – ikonu vykresluje Trello ve svém vlastním
         rozhraní na trello.com, relativní cesta by se hledala tam.        */
      icon: 'https://www.denteo.space/zakazkovy-list/logo-icon-gray.svg',
      content: {
        type: 'iframe',
        url: t.signUrl(page, { theme: theme }),
        height: 300
      }
    };
  }
});
</script>
</body>
</html>
